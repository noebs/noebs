name: ${COMPOSE_PROJECT_NAME}

x-noebs-runtime: &noebs-runtime
  image: ${NOEBS_ALPHA_E2E_IMAGE}
  init: true
  read_only: true
  user: "10001:10001"
  cpus: 0.75
  mem_limit: 256m
  mem_reservation: 64m
  pids_limit: 128
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  networks:
    - alpha
  restart: "no"

x-age-key-secret: &age-key-secret
  source: age_key
  target: /app/.sops/age-key.txt
  uid: "10001"
  gid: "10001"
  mode: 0400

services:
  postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    pull_policy: missing
    init: true
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    environment:
      POSTGRES_USER: noebs
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-alpha-e2e.sql:ro
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=512m
    networks:
      - alpha
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noebs -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  capture:
    image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    pull_policy: missing
    init: true
    read_only: true
    user: "65534:65534"
    cpus: 0.25
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["python", "/opt/noebs-e2e/capture.py", "serve"]
    volumes:
      - ./capture.py:/opt/noebs-e2e/capture.py:ro
    secrets:
      - source: otp_sms_key
        target: otp_sms_key
        uid: "65534"
        gid: "65534"
        mode: 0400
      - source: otp_read_token
        target: otp_read_token
        uid: "65534"
        gid: "65534"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - alpha
    healthcheck:
      test: ["CMD", "python", "/opt/noebs-e2e/capture.py", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  identity-auth-migrate:
    <<: *noebs-runtime
    volumes:
      - ${NOEBS_ALPHA_E2E_RUNTIME}/config.yaml:/app/config.yaml:ro
      - ${NOEBS_ALPHA_E2E_RUNTIME}/services/identity-auth-migrate.yaml:/app/service.yaml:ro
    secrets:
      - *age-key-secret
      - source: identity_auth_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400

  card-vault-migrate:
    <<: *noebs-runtime
    volumes:
      - ${NOEBS_ALPHA_E2E_RUNTIME}/config.yaml:/app/config.yaml:ro
      - ${NOEBS_ALPHA_E2E_RUNTIME}/services/card-vault-migrate.yaml:/app/service.yaml:ro
    secrets:
      - *age-key-secret
      - source: card_vault_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400

  consumer-beneficiary-migrate:
    <<: *noebs-runtime
    volumes:
      - ${NOEBS_ALPHA_E2E_RUNTIME}/config.yaml:/app/config.yaml:ro
      - ${NOEBS_ALPHA_E2E_RUNTIME}/services/consumer-beneficiary-migrate.yaml:/app/service.yaml:ro
    secrets:
      - *age-key-secret
      - source: consumer_beneficiary_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400

  identity-auth:
    <<: *noebs-runtime
    depends_on:
      postgres:
        condition: service_healthy
      capture:
        condition: service_healthy
    volumes:
      - ${NOEBS_ALPHA_E2E_RUNTIME}/config.yaml:/app/config.yaml:ro
      - ${NOEBS_ALPHA_E2E_RUNTIME}/services/identity-auth.yaml:/app/service.yaml:ro
    secrets:
      - *age-key-secret
      - source: identity_auth_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/test"]
      interval: 2s
      timeout: 2s
      retries: 30

  card-vault:
    <<: *noebs-runtime
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${NOEBS_ALPHA_E2E_RUNTIME}/config.yaml:/app/config.yaml:ro
      - ${NOEBS_ALPHA_E2E_RUNTIME}/services/card-vault.yaml:/app/service.yaml:ro
    secrets:
      - *age-key-secret
      - source: card_vault_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/test"]
      interval: 2s
      timeout: 2s
      retries: 30

  consumer-beneficiary:
    <<: *noebs-runtime
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${NOEBS_ALPHA_E2E_RUNTIME}/config.yaml:/app/config.yaml:ro
      - ${NOEBS_ALPHA_E2E_RUNTIME}/services/consumer-beneficiary.yaml:/app/service.yaml:ro
    secrets:
      - *age-key-secret
      - source: consumer_beneficiary_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/test"]
      interval: 2s
      timeout: 2s
      retries: 30

  api-gateway:
    <<: *noebs-runtime
    depends_on:
      identity-auth:
        condition: service_healthy
      card-vault:
        condition: service_healthy
      consumer-beneficiary:
        condition: service_healthy
      capture:
        condition: service_healthy
    volumes:
      - ${NOEBS_ALPHA_E2E_RUNTIME}/config.yaml:/app/config.yaml:ro
      - ${NOEBS_ALPHA_E2E_RUNTIME}/services/api-gateway.yaml:/app/service.yaml:ro
    secrets:
      - *age-key-secret
      - source: api_gateway_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/test"]
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  alpha:
    internal: true

secrets:
  age_key:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/age-key.txt
  postgres_password:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/postgres-password.txt
  otp_sms_key:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/otp-sms-key.txt
  otp_read_token:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/otp-read-token.txt
  api_gateway_secrets:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/api-gateway.secrets.yaml
  identity_auth_secrets:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/identity-auth.secrets.yaml
  card_vault_secrets:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/card-vault.secrets.yaml
  consumer_beneficiary_secrets:
    file: ${NOEBS_ALPHA_E2E_RUNTIME}/consumer-beneficiary.secrets.yaml
