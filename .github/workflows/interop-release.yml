name: Immutable interop release
on:
  push:
    branches: [master]
    paths-ignore: [docs/**]
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: noebs-interop-release
  cancel-in-progress: false
jobs:
  publish-noebs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable noebs image
        run: scripts/publish-alpha-image.sh "$GITHUB_SHA" "$RUNNER_TEMP/noebs-receipt.json"
      - name: Preserve noebs receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noebs-build-${{ github.sha }}
          path: ${{ runner.temp }}/noebs-receipt.json
          if-no-files-found: error
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
  publish-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish pinned Mojaloop SDK profile
        run: scripts/publish-interop-sdk.sh "$GITHUB_SHA" "$RUNNER_TEMP/sdk-receipt.json"
      - name: Preserve SDK receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-build-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-receipt.json
          if-no-files-found: error
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
  receipts:
    needs: [publish-noebs, publish-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect receipts from this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "noebs-build-$GITHUB_SHA" --dir "$RUNNER_TEMP/receipts"
          gh run download "$GITHUB_RUN_ID" --name "sdk-build-$GITHUB_SHA" --dir "$RUNNER_TEMP/receipts"
      - name: Preserve release receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interop-release-${{ github.sha }}
          path: ${{ runner.temp }}/receipts/*-receipt.json
          if-no-files-found: error
