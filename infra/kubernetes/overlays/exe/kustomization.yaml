apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: noebs
resources:
- ../../base
- storage.yaml
images:
- name: ghcr.io/noebs/noebs
  newName: ghcr.io/noebs/noebs
  digest: sha256:58212ab8f1bbbb01ff35f6bfa2b5900a0cd0766c07d08a3552e228241c45c1e9
- name: postgres
  newName: docker.io/library/postgres
  digest: sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
- name: apache/kafka
  newName: docker.io/apache/kafka
  digest: sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
- name: quay.io/keycloak/keycloak
  newName: quay.io/keycloak/keycloak
  digest: sha256:2eb3cd316835c990e69e26ade292ffa78f6fb0db7d5fc6377463c162e1979ac0
- name: temporalio/auto-setup
  newName: docker.io/temporalio/auto-setup
  digest: sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (api-gateway|card-vault|identity-auth)
  patch: "- op: add\n  path: /spec/strategy\n  value:\n    type: Recreate"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (admin-reporting|api-gateway|card-vault|ebs-adapter|identity-auth|notification-chat|psp-webhook|wallet-api|wallet-ledger)
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 25m\n      memory: 64Mi\n    limits:\n      cpu: 500m\n\
    \      memory: 256Mi"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (admin-reporting-projector|ebs-adapter-events|identity-worker|wallet-worker)
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 50m\n      memory: 64Mi\n    limits:\n      cpu: \"\
    1\"\n      memory: 512Mi"
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: (postgres|temporal-postgres)
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 100m\n      memory: 256Mi\n    limits:\n      cpu:\
    \ \"1\"\n      memory: 1Gi"
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: keycloak-postgres
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 50m\n      memory: 128Mi\n    limits:\n      cpu: 500m\n\
    \      memory: 512Mi"
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: kafka
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 250m\n      memory: 768Mi\n    limits:\n      cpu:\
    \ \"1500m\"\n      memory: 1536Mi"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: temporal
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 100m\n      memory: 256Mi\n    limits:\n      cpu:\
    \ \"1\"\n      memory: 1Gi"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: keycloak
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 250m\n      memory: 768Mi\n    limits:\n      cpu:\
    \ \"1\"\n      memory: 1536Mi"
- target:
    group: batch
    version: v1
    kind: Job
    name: (noebs-deployment-preflight|noebs-keycloak-reconciler|noebs-.*-migrate)
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 25m\n      memory: 64Mi\n    limits:\n      cpu: 500m\n\
    \      memory: 256Mi"
- target:
    group: batch
    version: v1
    kind: Job
    name: (kafka-topics|temporal-schema-migrate|temporal-namespace-bootstrap)
  patch: "- op: add\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 50m\n      memory: 128Mi\n    limits:\n      cpu: 500m\n\
    \      memory: 512Mi"
- target:
    group: batch
    version: v1
    kind: CronJob
    name: (noebs-workload-auth-cleanup|noebs-gateway-auth-cleanup)
  patch: "- op: add\n  path: /spec/jobTemplate/spec/template/spec/containers/0/resources\n\
    \  value:\n    requests:\n      cpu: 10m\n      memory: 32Mi\n    limits:\n  \
    \    cpu: 250m\n      memory: 128Mi"
- target:
    kind: (Deployment|Job)
    name: (admin-reporting|admin-reporting-projector|api-gateway|card-vault|ebs-adapter|ebs-adapter-events|identity-auth|identity-worker|notification-chat|psp-webhook|wallet-api|wallet-ledger|wallet-worker|noebs-.*-migrate)
  patch: "- op: add\n  path: /spec/template/spec/initContainers\n  value:\n    - name:\
    \ wait-for-postgres\n      image: ghcr.io/noebs/noebs:master\n      imagePullPolicy:\
    \ IfNotPresent\n      command: [/bin/bash, -ec]\n      args:\n        - |\n  \
    \        until timeout 2 bash -c 'exec 3<>/dev/tcp/postgres/5432' 2>/dev/null;\
    \ do\n            sleep 1\n          done\n      resources:\n        requests:\n\
    \          cpu: 10m\n          memory: 16Mi\n        limits:\n          cpu: 100m\n\
    \          memory: 64Mi\n      securityContext:\n        allowPrivilegeEscalation:\
    \ false\n        capabilities:\n          drop:\n            - ALL\n        readOnlyRootFilesystem:\
    \ true"
- target:
    group: batch
    version: v1
    kind: CronJob
    name: (noebs-workload-auth-cleanup|noebs-gateway-auth-cleanup)
  patch: "- op: add\n  path: /spec/jobTemplate/spec/template/spec/initContainers\n\
    \  value:\n    - name: wait-for-postgres\n      image: ghcr.io/noebs/noebs:master\n\
    \      imagePullPolicy: IfNotPresent\n      command: [/bin/bash, -ec]\n      args:\n\
    \        - |\n          until timeout 2 bash -c 'exec 3<>/dev/tcp/postgres/5432'\
    \ 2>/dev/null; do\n            sleep 1\n          done\n      resources:\n   \
    \     requests:\n          cpu: 10m\n          memory: 16Mi\n        limits:\n\
    \          cpu: 100m\n          memory: 64Mi\n      securityContext:\n       \
    \ allowPrivilegeEscalation: false\n        capabilities:\n          drop:\n  \
    \          - ALL\n        readOnlyRootFilesystem: true"
- target:
    kind: StatefulSet
  patch: "- op: add\n  path: /spec/template/spec/nodeSelector\n  value: {noebs.dev/role:\
    \ data}\n- op: add\n  path: /spec/volumeClaimTemplates/0/spec/storageClassName\n\
    \  value: noebs-retain"
- target:
    kind: Deployment
    name: (temporal|keycloak)
  patch: "- op: add\n  path: /spec/template/spec/nodeSelector\n  value: {noebs.dev/role:\
    \ data}"
- target:
    kind: Deployment
    name: (admin-reporting|admin-reporting-projector|api-gateway|card-vault|ebs-adapter|ebs-adapter-events|identity-auth|identity-worker|notification-chat|psp-webhook|wallet-api|wallet-ledger|wallet-worker)
  patch: "- op: add\n  path: /spec/template/spec/nodeSelector\n  value: {noebs.dev/role:\
    \ workers}"
