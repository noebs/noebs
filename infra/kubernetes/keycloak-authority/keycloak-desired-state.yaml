api_version: noebs.sd/keycloak/v1
backoffice_origin: https://noebs-workers.tail09832.ts.net
realm:
  name: noebs
  display_name: Noebs
  access_token_lifespan_seconds: 300
  sso_session_idle_timeout_seconds: 1800
  sso_session_max_lifespan_seconds: 28800
  revoke_refresh_token: true
  refresh_token_max_reuse: 0
authentication:
  local_accounts:
    registration_allowed: true
    verify_email: true
    reset_password_allowed: true
    minimum_password_length: 12
  browser_flow: noebs-browser
  first_broker_login_flow: noebs-first-broker-login
  post_broker_login_flow: noebs-post-broker
  levels:
    - acr: urn:noebs:acr:primary
      level: 1
      max_age_seconds: 28800
    - acr: urn:noebs:acr:mfa
      level: 2
      # Current authorization only; never persisted into the SSO session.
      max_age_seconds: 0
  otp:
    type: totp
    # Microsoft Authenticator requires SHA-1, six digits and a 30-second period.
    # This sets new enrollment; existing credentials retain their own algorithm.
    algorithm: HmacSHA1
    initial_counter: 0
    digits: 6
    look_ahead_window: 1
    period_seconds: 30
    reusable: false
    configure_required_action:
      alias: CONFIGURE_TOTP
      enabled: true
      default_action: true
      priority: 10
reconciler_client:
  client_id: noebs-keycloak-reconciler
  name: Noebs Keycloak Reconciler
  credential: noebs-keycloak-reconciler
  realm_management_roles:
    - realm-admin
enrollment_client:
  client_id: noebs-account-enroller
  name: Noebs Account Enroller
  credential: noebs-account-enroller
  realm_management_roles:
    - manage-organizations
    - manage-users
resource_client:
  client_id: noebs-api
  name: Noebs API
  roles:
    - name: user
      description: Tenant user
    - name: backoffice
      description: Tenant back-office operator
    - name: tenant-admin
      description: Tenant administrator
    - name: reporting:read
      description: Read tenant reports
    - name: wallet:read
      description: Read tenant wallet state
    - name: wallet:audit:read
      description: Audit tenant wallet activity
    - name: wallet:manual:create
      description: Create manual operations
    - name: wallet:fees:write
      description: Change tenant fee configuration
    - name: wallet:rates:write
      description: Change tenant rate configuration
    - name: wallet:workflow:approve
      description: Approve tenant workflows
    - name: wallet:workflow:reject
      description: Reject tenant workflows
    - name: identity:review:read
      description: Read tenant verification cases
    - name: identity:review:decide
      description: Decide tenant verification cases
    - name: wallet:transaction:resolve
      description: Resolve tenant transactions manually
interactive_clients:
  - client_id: noebs-mobile
    name: Noebs Mobile
    access_type: public
    credential: ""
    authentication_level: 1
    redirect_uris:
      - https://api.noebs.sd/mobile/oauth/callback
    post_logout_redirect_uris: []
    web_origins: []
  - client_id: noebs-backoffice
    name: Noebs Backoffice
    access_type: confidential
    credential: noebs-backoffice
    authentication_level: 1
    redirect_uris:
      - https://noebs-workers.tail09832.ts.net/backoffice/oauth/callback
    post_logout_redirect_uris:
      - https://noebs-workers.tail09832.ts.net/backoffice/oauth/logout/callback
    web_origins: []
  - client_id: noebs-wallet-authorizer
    name: Noebs Wallet Authorizer
    access_type: confidential
    credential: noebs-wallet-authorizer
    authentication_level: 2
    redirect_uris:
      - https://api.noebs.sd/wallet/authorizations/oauth/callback
    post_logout_redirect_uris: []
    web_origins: []
  - client_id: noebs-web
    name: Noebs Web
    access_type: confidential
    credential: noebs-web
    authentication_level: 1
    redirect_uris:
      - https://api.noebs.sd/account/oauth/callback
    post_logout_redirect_uris:
      - https://api.noebs.sd/account/oauth/logout/callback
    web_origins: []
service_clients:
  - client_id: noebs-temporal-wallet-ledger
    name: Noebs Temporal Wallet Ledger
    credential: noebs-temporal-wallet-ledger
    audience: noebs-temporal
    permissions:
      - default:write
  - client_id: noebs-temporal-wallet-worker
    name: Noebs Temporal Wallet Worker
    credential: noebs-temporal-wallet-worker
    audience: noebs-temporal
    permissions:
      - default:write
  - client_id: noebs-temporal-identity-auth
    name: Noebs Temporal Identity Auth
    credential: noebs-temporal-identity-auth
    audience: noebs-temporal
    permissions:
      - default:write
  - client_id: noebs-temporal-identity-worker
    name: Noebs Temporal Identity Worker
    credential: noebs-temporal-identity-worker
    audience: noebs-temporal
    permissions:
      - default:write
  - client_id: noebs-temporal-namespace-bootstrap
    name: Noebs Temporal Namespace Bootstrap
    credential: noebs-temporal-namespace-bootstrap
    audience: noebs-temporal
    permissions:
      - temporal-system:admin
realm_roles: []
organization_claim:
  client_scope: organization
  mapper_name: noebs-organization-groups
  protocol_mapper: oidc-organization-group-membership-mapper
  config:
    id.token.claim: "false"
    access.token.claim: "true"
    lightweight.claim: "false"
    userinfo.token.claim: "false"
    introspection.token.claim: "false"
    addGroupRoleMappings: "true"
identity_providers:
  - alias: google
    display_name: Google
    provider_id: google
    credential: google
    config:
      defaultScope: openid profile email
      # Never forward the Noebs-local acr_values vocabulary to Google.
      forwardParameters: login_hint
      issuer: https://accounts.google.com
      syncMode: IMPORT
organizations:
- alias: noebs
  name: Noebs
  attributes: {}
  groups:
  - name: user
    description: Tenant users
    attributes: {}
    client_roles:
    - user
  - name: backoffice
    description: Tenant back-office operators
    attributes: {}
    client_roles:
    - backoffice
    - reporting:read
    - wallet:read
    - wallet:audit:read
    - identity:review:read
  - name: tenant-admin
    description: Tenant administrators
    attributes: {}
    client_roles:
    - tenant-admin
    - reporting:read
    - wallet:read
    - wallet:audit:read
    - identity:review:read
    - wallet:manual:create
    - wallet:fees:write
    - wallet:rates:write
    - wallet:workflow:approve
    - wallet:workflow:reject
    - identity:review:decide
    - wallet:transaction:resolve
