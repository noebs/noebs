apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: noebs-backoffice
spec:
  entryPoints: [backoffice]
  routes:
    - kind: Rule
      match: Host(`noebs-workers.tail09832.ts.net`) && PathRegexp(`(?i)^/backoffice(?:/|$)`)
      priority: 100
      middlewares: [{name: backoffice-headers}, {name: compress}]
      services:
        - name: api-gateway
          port: 8080
          scheme: https
          passHostHeader: true
          serversTransport: api-gateway
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: backoffice-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    forceSTSHeader: true
    customRequestHeaders:
      X-Real-IP: ""
      X-Forwarded-Host: noebs-workers.tail09832.ts.net
      X-Forwarded-Proto: https
      X-Forwarded-Port: "443"
