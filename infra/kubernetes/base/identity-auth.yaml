apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-auth
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: identity-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-auth
    spec:
      serviceAccountName: identity-auth
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: identity-auth
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command: [/usr/local/bin/noebs, internal-healthcheck]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/usr/local/bin/noebs, internal-healthcheck]
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: identity-auth.service.yaml
              readOnly: true
            - name: identity-auth-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: identity-auth-secrets
          secret:
            secretName: identity-auth-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: identity-auth
  labels:
    app.kubernetes.io/name: identity-auth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
