apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-worker
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: identity-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-worker
    spec:
      serviceAccountName: identity-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: identity-worker
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/noebs, identity-worker]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /test, port: http}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /test, port: http}
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: config, mountPath: /app/service.yaml, subPath: identity-worker.service.yaml, readOnly: true}
            - {name: credentials, mountPath: /app/secrets.yaml, subPath: secrets.yaml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: noebs-config}
        - name: credentials
          secret: {secretName: identity-worker-secrets}
