base_url: https://keycloak.noebs.svc.cluster.local:8443/auth
admin_realm: noebs
client_id: noebs-keycloak-reconciler
client_secret: REPLACE_WITH_RECONCILER_CLIENT_SECRET
client_credentials:
  noebs-keycloak-reconciler:
    client_secret: REPLACE_WITH_RECONCILER_CLIENT_SECRET
  noebs-backoffice:
    client_secret: REPLACE_WITH_BACKOFFICE_CLIENT_SECRET
  noebs-web:
    client_secret: REPLACE_WITH_WEB_CLIENT_SECRET
  noebs-account-enroller:
    client_secret: REPLACE_WITH_ACCOUNT_ENROLLER_CLIENT_SECRET
  noebs-wallet-authorizer:
    client_secret: REPLACE_WITH_WALLET_AUTHORIZER_CLIENT_SECRET
  noebs-temporal-wallet-ledger:
    client_secret: REPLACE_WITH_TEMPORAL_WALLET_LEDGER_CLIENT_SECRET
  noebs-temporal-wallet-worker:
    client_secret: REPLACE_WITH_TEMPORAL_WALLET_WORKER_CLIENT_SECRET
  noebs-temporal-identity-auth:
    client_secret: REPLACE_WITH_TEMPORAL_IDENTITY_AUTH_CLIENT_SECRET
  noebs-temporal-identity-worker:
    client_secret: REPLACE_WITH_TEMPORAL_IDENTITY_WORKER_CLIENT_SECRET
  noebs-temporal-namespace-bootstrap:
    client_secret: REPLACE_WITH_TEMPORAL_NAMESPACE_BOOTSTRAP_CLIENT_SECRET
identity_providers:
  google:
    client_id: REPLACE_WITH_GOOGLE_CLIENT_ID
    client_secret: REPLACE_WITH_GOOGLE_CLIENT_SECRET
# Required when local email verification or password recovery is enabled.
smtp:
  host: smtp.example.com
  port: 465
  from: accounts@example.com
  from_display_name: Accounts
  username: REPLACE_WITH_SMTP_USERNAME
  password: REPLACE_WITH_SMTP_PASSWORD
  tls: true
