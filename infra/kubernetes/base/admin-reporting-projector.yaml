apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-reporting-projector
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: admin-reporting-projector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-reporting-projector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-reporting-projector
    spec:
      serviceAccountName: admin-reporting-projector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: admin-reporting-projector
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /test
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /test
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: admin-reporting-projector.service.yaml
              readOnly: true
            - name: admin-reporting-projector-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: admin-reporting-projector-secrets
          secret:
            secretName: admin-reporting-projector-secrets
