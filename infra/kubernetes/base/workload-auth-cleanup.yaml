apiVersion: batch/v1
kind: CronJob
metadata:
  name: noebs-workload-auth-cleanup
  annotations:
    argocd.argoproj.io/sync-wave: "19"
  labels:
    app.kubernetes.io/name: noebs-workload-auth-cleanup
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: noebs-workload-auth-cleanup
        spec:
          serviceAccountName: workload-auth-cleanup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: cleanup
              image: ghcr.io/noebs/noebs:master
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
              volumeMounts:
                - name: config
                  mountPath: /app/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: config
                  mountPath: /app/service.yaml
                  subPath: workload-auth-cleanup.service.yaml
                  readOnly: true
                - name: workload-auth-cleanup-secrets
                  mountPath: /app/secrets.yaml
                  subPath: secrets.yaml
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: noebs-config
            - name: workload-auth-cleanup-secrets
              secret:
                secretName: workload-auth-cleanup-secrets
