noebs:
  sops_age_key_file: /app/.sops/age-key.txt
  runtime_dir: /app/runtime
  render_db_password_file: /app/runtime/postgres_password.txt
  db_driver: pgx
  port: ":8080"
  temporal_enabled: true
  temporal_host: "temporal"
  temporal_port: "7233"
  temporal_namespace: "default"
  wallet_enabled: true
  wallet_pin_required: true
  wallet_default_currency: "SDG"
  grpc_enabled: true
  grpc_port: ":9090"
  grpc_gateway_enabled: false
  grpc_gateway_port: ":9091"
  service_discovery:
    identity-auth: "http://identity-auth:8080"
    card-vault: "http://card-vault:8080"
    ebs-adapter: "http://ebs-adapter:8080"
    psp-webhook: "http://psp-webhook:8080"
    admin-reporting: "http://admin-reporting:8080"
    notification-chat: "http://notification-chat:8080"
    consumer-beneficiary: "http://consumer-beneficiary:8080"
    wallet-api: "http://wallet-api:8080"
  is_debug: false
  # Only enable for local/dev when the EBS endpoint uses a self-signed cert.
  ebs_insecure_skip_verify: false
  cors:
    - "*"
  # Optional outbound callback (disabled when empty).
  consumer_biller_hooks_url: ""
