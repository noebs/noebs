noebs:
  sops_age_key_file: /app/.sops/age-key.txt
  runtime_dir: /app/runtime
  render_db_password_file: /app/runtime/password
  port: ":8080"
  temporal_enabled: true
  temporal_host: "temporal"
  temporal_port: "7233"
  temporal_namespace: "default"
  wallet_enabled: true
  wallet_pin_required: true
  wallet_2fa_threshold: 10000
  wallet_approval_threshold: 100000
  wallet_default_currency: "SDG"
  wallet_hold_expiry_seconds: 3600
  wallet_approval_timeout_seconds: 3600
  wallet_verification_timeout_seconds: 86400
  wallet_manual_approval_timeout_seconds: 86400
  wallet_psp_poller_cron: "*/5 * * * *"
  wallet_psp_poller_batch_size: 100
  wallet_psp_poller_interval_seconds: 300
  wallet_reconciliation_cron: "0 3 * * *"
  wallet_reconciliation_batch_size: 500
  wallet_reconciliation_lookback_hours: 24
  grpc_enabled: true
  grpc_port: ":9090"
  grpc_gateway_enabled: false
  grpc_gateway_port: ":9091"
  service_discovery:
    identity-auth: "http://identity-auth:8080"
    keycloak: "http://keycloak:8080"
    card-vault: "http://card-vault:8080"
    ebs-adapter: "http://ebs-adapter:8080"
    psp-webhook: "http://psp-webhook:8080"
    admin-reporting: "http://admin-reporting:8080"
    notification-chat: "http://notification-chat:8080"
    consumer-beneficiary: "http://consumer-beneficiary:8080"
    wallet-api: "http://wallet-api:8080"
  grpc_service_discovery:
    wallet-ledger: "wallet-ledger:9090"
  is_debug: false
  # Only enable for local/dev when the EBS endpoint uses a self-signed cert.
  ebs_insecure_skip_verify: false
  cors:
    - "*"
  # Optional outbound callback (disabled when empty).
  consumer_biller_hooks_url: ""
  ebs_dynamic_fees:
    p2p_fees: 30
    custom_fees: 85
    special_payment_fees: 2
