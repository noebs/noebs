syntax = "proto3";

package noebs.wallet.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/adonese/noebs/gen/proto/noebs/wallet/v1;walletv1";

service WalletInternalService {
  rpc GetWallet(GetWalletRequest) returns (Wallet) {}
  rpc EnsureWallet(EnsureWalletRequest) returns (Wallet) {}
  rpc ValidateP2P(ValidateP2PRequest) returns (ValidateP2PResponse) {}
  rpc RequestP2PTransfer(P2PTransferRequest) returns (WorkflowRun) {}
  rpc RequestDeposit(DepositRequest) returns (WorkflowRun) {}
  rpc RequestWithdrawal(WithdrawalRequest) returns (WorkflowRun) {}
  rpc RequestManualTransfer(ManualTransferRequest) returns (WorkflowRun) {}
  rpc SignalWithdrawalApproval(WithdrawalApprovalRequest) returns (google.protobuf.Empty) {}
  rpc SignalWithdrawalVerification(WithdrawalDestinationVerificationRequest) returns (google.protobuf.Empty) {}
  rpc SignalManualTransferDecision(ManualTransferDecisionRequest) returns (google.protobuf.Empty) {}
}

service WalletPublicService {
  rpc GetWalletPublic(GetWalletRequest) returns (Wallet) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}"
    };
  }
  rpc EnsureWalletPublic(EnsureWalletRequest) returns (Wallet) {
    option (google.api.http) = {
      post: "/wallet"
      body: "*"
    };
  }
  rpc RequestP2PTransfer(P2PTransferRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/p2p"
      body: "*"
    };
  }
  rpc RequestDeposit(DepositRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/deposits"
      body: "*"
    };
  }
  rpc RequestManualTransfer(ManualTransferRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/manual_transfers"
      body: "*"
    };
  }
  rpc RequestWithdrawal(WithdrawalRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/withdrawals"
      body: "*"
    };
  }
  rpc SignalWithdrawalApproval(WithdrawalApprovalRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/withdrawals/{workflow_id}/approval"
      body: "*"
    };
  }
  rpc SignalWithdrawalVerification(WithdrawalDestinationVerificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/withdrawals/{workflow_id}/verification"
      body: "*"
    };
  }
  rpc SignalManualTransferDecision(ManualTransferDecisionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/manual_transfers/{workflow_id}/decision"
      body: "*"
    };
  }
}

message Wallet {
  string id = 1;
  string tenant_id = 2;
  string owner_type = 3;
  string owner_id = 4;
  string currency = 5;
  int64 balance = 6;
  int64 available_balance = 7;
  string status = 8;
  string kyc_tier = 9;
}

message GetWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message EnsureWalletRequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string currency = 3;
}

message ValidateP2PRequest {
  string tenant_id = 1;
  string from_wallet_id = 2;
  string to_wallet_id = 3;
  string currency = 4;
  int64 amount = 5;
}

message ValidateP2PResponse {
  bool allowed = 1;
  string reason = 2;
  int64 total_debit = 3;
  int64 fee = 4;
}

message WorkflowRun {
  string workflow_id = 1;
  string run_id = 2;
}

message P2PTransferRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string currency = 3;
  string from_wallet_id = 4;
  string to_wallet_id = 5;
  int64 amount = 6;
  string description = 7;
  string reference_id = 8;
  string from_owner_type = 9;
  string from_owner_id = 10;
  string to_owner_type = 11;
  string to_owner_id = 12;
}

message DepositRequest {
  string tenant_id = 1;
  string client_reference = 2;
  string provider_code = 3;
  string wallet_id = 4;
  string owner_type = 5;
  string owner_id = 6;
  string psp_transaction_id = 7;
  int64 amount = 8;
  string currency = 9;
  optional int64 fee_amount = 10;
  optional int64 net_amount = 11;
  string idempotency_key = 12;
  google.protobuf.Struct metadata = 13;
}

message ManualTransferRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string transfer_type = 3;
  string wallet_id = 4;
  int64 amount = 5;
  string currency = 6;
  string reason = 7;
  int64 requested_by = 8;
  string psp_provider = 9;
  string psp_reference = 10;
  int32 approval_timeout_seconds = 11;
}

message ManualTransferDecisionRequest {
  string workflow_id = 1;
  bool approved = 2;
  int64 approver_id = 3;
  string reason = 4;
  string proof_of_payment = 5;
}

message WithdrawalRequest {
  string tenant_id = 1;
  string client_reference = 2;
  string provider_code = 3;
  string wallet_id = 4;
  int64 amount = 5;
  string currency = 6;
  int64 user_id = 7;
  string owner_type = 8;
  string owner_id = 9;
  int64 destination_id = 10;
  optional bool allow_return_to_source = 11;
  string wallet_pin = 12;
  string two_fa_code = 13;
  int32 hold_expiry_seconds = 14;
  int32 approval_timeout_seconds = 15;
  int32 verification_timeout_seconds = 16;
  string idempotency_key = 17;
  google.protobuf.Struct metadata = 18;
}

message WithdrawalApprovalRequest {
  string workflow_id = 1;
  bool approved = 2;
  int64 approver_id = 3;
  string reason = 4;
  string proof_of_payment = 5;
}

message WithdrawalDestinationVerificationRequest {
  string workflow_id = 1;
  int64 verification_id = 2;
  bool verified = 3;
  string reason = 4;
}
