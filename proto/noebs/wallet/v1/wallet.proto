syntax = "proto3";

package noebs.wallet.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/adonese/noebs/gen/proto/noebs/wallet/v1;walletv1";

service WalletPublicService {
  rpc GetWalletPublic(GetWalletPublicRequest) returns (GetWalletPublicResponse) {
    option (google.api.http) = {get: "/wallet/{wallet_id}"};
  }
  rpc EnsureWalletPublic(EnsureWalletPublicRequest) returns (EnsureWalletPublicResponse) {
    option (google.api.http) = {
      post: "/wallet"
      body: "*"
    };
  }
  rpc ListPaymentMethodsPublic(ListPaymentMethodsPublicRequest) returns (ListPaymentMethodsPublicResponse) {
    option (google.api.http) = {get: "/wallet/methods"};
  }
  rpc ListWalletTransactionsPublic(ListWalletTransactionsPublicRequest) returns (ListWalletTransactionsPublicResponse) {
    option (google.api.http) = {get: "/wallet/{wallet_id}/transactions"};
  }
  rpc RequestP2PTransfer(RequestP2PTransferRequest) returns (RequestP2PTransferResponse) {}
  rpc RequestDeposit(RequestDepositRequest) returns (RequestDepositResponse) {
    option (google.api.http) = {
      post: "/wallet/deposits"
      body: "*"
    };
  }
  rpc RequestWithdrawal(RequestWithdrawalRequest) returns (RequestWithdrawalResponse) {}
  rpc ListFundingSources(ListFundingSourcesRequest) returns (ListFundingSourcesResponse) {
    option (google.api.http) = {get: "/wallet/{wallet_id}/funding_sources"};
  }
  rpc CreateWithdrawalDestination(CreateWithdrawalDestinationRequest) returns (CreateWithdrawalDestinationResponse) {
    option (google.api.http) = {
      post: "/wallet/destinations"
      body: "*"
    };
  }
  rpc ListWithdrawalDestinations(ListWithdrawalDestinationsRequest) returns (ListWithdrawalDestinationsResponse) {
    option (google.api.http) = {get: "/wallet/{wallet_id}/destinations"};
  }
  rpc DeactivateWithdrawalDestination(DeactivateWithdrawalDestinationRequest) returns (DeactivateWithdrawalDestinationResponse) {
    option (google.api.http) = {
      post: "/wallet/destinations/{destination_id}/deactivate"
      body: "*"
    };
  }
  rpc ListCurrenciesPublic(ListCurrenciesPublicRequest) returns (ListCurrenciesPublicResponse) {
    option (google.api.http) = {get: "/wallet/currencies"};
  }
  rpc GetCurrencyPublic(GetCurrencyPublicRequest) returns (GetCurrencyPublicResponse) {
    option (google.api.http) = {get: "/wallet/currencies/{currency_code}"};
  }
  rpc ParseMoneyPublic(ParseMoneyPublicRequest) returns (ParseMoneyPublicResponse) {
    option (google.api.http) = {
      post: "/wallet/money/parse"
      body: "*"
    };
  }
  rpc FormatMoneyPublic(FormatMoneyPublicRequest) returns (FormatMoneyPublicResponse) {
    option (google.api.http) = {
      post: "/wallet/money/format"
      body: "*"
    };
  }
  rpc QuoteConversionPublic(QuoteConversionPublicRequest) returns (QuoteConversionPublicResponse) {
    option (google.api.http) = {
      post: "/wallet/fx/quotes"
      body: "*"
    };
  }
  rpc GetConversionQuotePublic(GetConversionQuotePublicRequest) returns (GetConversionQuotePublicResponse) {
    option (google.api.http) = {get: "/wallet/fx/quotes/{quote_id}"};
  }
  rpc ListFXSourcesPublic(ListFXSourcesPublicRequest) returns (ListFXSourcesPublicResponse) {
    option (google.api.http) = {get: "/wallet/fx/sources"};
  }
}

service WalletAdminService {
  rpc RenderWalletAdmin(RenderWalletAdminRequest) returns (RenderWalletAdminResponse) {}
}

enum AdminWalletAction {
  ADMIN_WALLET_ACTION_UNSPECIFIED = 0;
  ADMIN_WALLET_ACTION_DASHBOARD = 1;
  ADMIN_WALLET_ACTION_LIST_WALLETS = 2;
  ADMIN_WALLET_ACTION_WALLET_DETAIL = 3;
  ADMIN_WALLET_ACTION_PENDING_APPROVALS = 4;
  ADMIN_WALLET_ACTION_LIST_AUDIT_EVENTS = 5;
  ADMIN_WALLET_ACTION_LIST_TRANSACTIONS = 6;
  ADMIN_WALLET_ACTION_TRANSACTION_DETAIL = 7;
  ADMIN_WALLET_ACTION_LIST_MANUAL_TRANSFERS = 8;
  ADMIN_WALLET_ACTION_SUBMIT_MANUAL_TRANSFER = 9;
  ADMIN_WALLET_ACTION_MANUAL_TRANSFER_DETAIL = 10;
  ADMIN_WALLET_ACTION_LIST_FEES = 11;
  ADMIN_WALLET_ACTION_CREATE_FEE = 12;
  ADMIN_WALLET_ACTION_LIST_RATES = 13;
  ADMIN_WALLET_ACTION_CREATE_RATE = 14;
  ADMIN_WALLET_ACTION_APPROVE_TRANSFER = 15;
  ADMIN_WALLET_ACTION_REJECT_TRANSFER = 16;
}

message RenderWalletAdminRequest {
  AdminWalletAction action = 1;
  map<string, string> query = 2;
  map<string, string> form = 3;
  map<string, string> path = 4;
}

message RenderWalletAdminResponse {
  int32 status_code = 1;
  string content_type = 2;
  bytes body = 3;
  string redirect_location = 4;
}

message Wallet {
  string id = 1;
  string tenant_id = 2;
  string owner_type = 3;
  string owner_id = 4;
  string currency = 5;
  int64 balance = 6;
  int64 available_balance = 7;
  string status = 8;
  string kyc_tier = 9;
  string created_at = 10;
  string updated_at = 11;
  MoneyAmount balance_money = 12;
  MoneyAmount available_balance_money = 13;
}

message GetWalletPublicRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message GetWalletPublicResponse {
  Wallet wallet = 1;
}

message EnsureWalletPublicRequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string currency = 3;
}

message EnsureWalletPublicResponse {
  Wallet wallet = 1;
}

message ListPaymentMethodsPublicRequest {
  string tenant_id = 1;
  string direction = 2;
  string currency = 3;
  string region = 4;
  int64 amount = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message PaymentMethod {
  string provider_code = 1;
  string provider_name = 2;
  string display_name = 3;
  string method_type = 4;
  string direction = 5;
  repeated string currencies = 6;
  repeated string regions = 7;
  optional int64 min_amount = 8;
  optional int64 max_amount = 9;
  string input_schema_json = 10;
  string presentation_json = 11;
  bool supports_deposit = 12;
  bool supports_withdrawal = 13;
  // Exact immutable scale used to interpret min_amount, max_amount, and the
  // amount filter that selected this method.
  int64 currency_unit_version_id = 14;
  // Exact string-backed representations for JavaScript and other clients that
  // cannot safely represent every int64. Legacy min_amount/max_amount remain
  // unchanged for backward compatibility.
  MoneyAmount min_amount_money = 15;
  MoneyAmount max_amount_money = 16;
}

message ListPaymentMethodsPublicResponse {
  repeated PaymentMethod methods = 1;
}

message ListWalletTransactionsPublicRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string entry_type = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message WalletLedgerEntry {
  int64 id = 1;
  string tenant_id = 2;
  int64 transaction_id = 3;
  string wallet_id = 4;
  string entry_type = 5;
  int64 amount = 6;
  string currency = 7;
  int64 balance_after = 8;
  int64 wallet_sequence = 9;
  string status = 10;
  string reference_type = 11;
  optional string reference_id = 12;
  optional string description = 13;
  string metadata_json = 14;
  string created_at = 15;
  MoneyAmount amount_money = 16;
  MoneyAmount balance_after_money = 17;
}

message ListWalletTransactionsPublicResponse {
  repeated WalletLedgerEntry transactions = 1;
}

message RequestP2PTransferRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string currency = 3;
  string from_wallet_id = 4;
  string to_wallet_id = 5;
  int64 amount = 6;
  string description = 7;
  string reference_id = 8;
  string from_owner_type = 9;
  string from_owner_id = 10;
  string to_owner_type = 11;
  string to_owner_id = 12;
}

message RequestP2PTransferResponse {
  string workflow_id = 1;
  string run_id = 2;
}

message RequestDepositRequest {
  string tenant_id = 1;
  string provider_code = 2;
  string wallet_id = 3;
  int64 amount = 4;
  string currency = 5;
  string idempotency_key = 6;
  google.protobuf.Struct metadata = 7;
  string region = 8;
}

message RequestDepositResponse {
  string workflow_id = 1;
  string run_id = 2;
}

message RequestWithdrawalRequest {
  string tenant_id = 1;
  string client_reference = 2;
  string provider_code = 3;
  string wallet_id = 4;
  int64 amount = 5;
  string currency = 6;
  string owner_type = 7;
  string owner_id = 8;
  int64 destination_id = 9;
  optional bool allow_return_to_source = 10;
  int32 hold_expiry_seconds = 11;
  int32 approval_timeout_seconds = 12;
  string idempotency_key = 13;
  google.protobuf.Struct metadata = 14;
  string region = 15;
  optional bool approval_required = 16;
}

message RequestWithdrawalResponse {
  string workflow_id = 1;
  string run_id = 2;
}

message FundingSource {
  int64 id = 1;
  string tenant_id = 2;
  string wallet_id = 3;
  string source_type = 4;
  string psp_provider = 5;
  string external_reference = 6;
  string verification_status = 7;
  string currency = 8;
  google.protobuf.Struct source_details = 9;
  int64 total_funded = 10;
  int64 total_withdrawn = 11;
  bool supports_withdrawal = 12;
  google.protobuf.Struct withdrawal_method = 13;
}

message ListFundingSourcesRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message ListFundingSourcesResponse {
  repeated FundingSource sources = 1;
}

message WithdrawalDestination {
  int64 id = 1;
  string tenant_id = 2;
  string wallet_id = 3;
  string destination_type = 4;
  string psp_provider = 5;
  google.protobuf.Struct destination_details = 6;
  string display_name = 7;
  string currency = 8;
  string country = 9;
  int64 linked_funding_source_id = 10;
  bool is_active = 11;
  int64 total_withdrawn = 12;
}

message CreateWithdrawalDestinationRequest {
  string tenant_id = 1;
  string display_name = 2;
  string country = 3;
  int64 linked_funding_source_id = 4;
}

message CreateWithdrawalDestinationResponse {
  WithdrawalDestination destination = 1;
}

message ListWithdrawalDestinationsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  bool active_only = 3;
}

message ListWithdrawalDestinationsResponse {
  repeated WithdrawalDestination destinations = 1;
}

message DeactivateWithdrawalDestinationRequest {
  string tenant_id = 1;
  int64 destination_id = 2;
}

message DeactivateWithdrawalDestinationResponse {}

message CurrencyUnit {
  string currency_code = 1;
  optional string numeric_code = 2;
  string name = 3;
  string kind = 4;
  bool active = 5;
  optional uint32 iso_minor_exponent = 6;
  uint32 display_exponent = 7;
  uint32 cash_exponent = 8;
  string cash_rounding_increment = 9;
  int64 version_id = 10;
  string valid_from = 11;
  optional string valid_to = 12;
  string source = 13;
  string source_revision = 14;
  string source_published_on = 15;
}

message MoneyAmount {
  // Exact signed operational minor units. This is a decimal string so JSON
  // clients never lose precision.
  string minor_units = 1;
  string currency_code = 2;
  // Immutable database-backed scale/version used to interpret minor_units.
  int64 currency_unit_version_id = 3;
  uint32 minor_exponent = 4;
  string major_units = 5;
  string display = 6;
  string canonical = 7;
}

message ListCurrenciesPublicRequest {
  string tenant_id = 1;
}

message ListCurrenciesPublicResponse {
  repeated CurrencyUnit currencies = 1;
}

message GetCurrencyPublicRequest {
  string tenant_id = 1;
  string currency_code = 2;
}

message GetCurrencyPublicResponse {
  CurrencyUnit currency = 1;
}

message ParseMoneyPublicRequest {
  string tenant_id = 1;
  string currency_code = 2;
  string major_units = 3;
  string rounding_mode = 4;
  // Exact immutable unit definition selected by the client from the currency
  // catalog. Parsing rejects inactive or not-yet-effective definitions.
  int64 currency_unit_version_id = 5;
}

message ParseMoneyPublicResponse {
  MoneyAmount money = 1;
}

message FormatMoneyPublicRequest {
  string tenant_id = 1;
  string currency_code = 2;
  string minor_units = 3;
  string rounding_mode = 4;
  // Exact immutable unit definition that originally interpreted minor_units.
  // Historical and inactive definitions remain valid for rendering.
  int64 currency_unit_version_id = 5;
}

message FormatMoneyPublicResponse {
  MoneyAmount money = 1;
}

message QuoteConversionPublicRequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string source_code = 3;
  string base_currency = 4;
  string quote_currency = 5;
  string input_minor_units = 6;
  string side = 7;
  // Quote rounding is a server policy (currently half-even), not caller input.
  reserved 8;
  reserved "rounding_mode";
  // Exact immutable units used for the input and output amounts. A quote never
  // resolves a "current" unit from currency code alone.
  int64 base_currency_unit_version_id = 9;
  int64 quote_currency_unit_version_id = 10;
  // Required opaque retry key. Reusing a key with the same semantic request
  // returns the original quote; reusing it for a different request fails.
  string idempotency_key = 11;
}

message ConversionQuote {
  string id = 1;
  MoneyAmount input = 2;
  MoneyAmount output = 3;
  string rounding_mode = 4;
  string source_code = 5;
  string source_name = 6;
  string source_purpose = 7;
  string source_url = 8;
  int64 observation_id = 9;
  string observation_base_currency = 10;
  string observation_quote_currency = 11;
  string observation_rate_decimal = 12;
  string applied_rate_numerator = 13;
  string applied_rate_denominator = 14;
  string requested_rate_side = 15;
  bool inverse = 16;
  string observation_at = 17;
  optional string published_at = 18;
  string retrieved_at = 19;
  string expires_at = 20;
  string source_revision = 21;
  // False for this reference/preview endpoint. It is not a trade commitment.
  optional bool executable = 22;
  // Side attached to the source observation. This can differ from the
  // requested side when an inverse bid/ask observation was selected.
  string observation_rate_side = 23;
  // Server-captured instant at which the exact unit versions and observation
  // were validated and the conversion was calculated.
  string conversion_at = 24;
  string idempotency_key = 25;
}

message QuoteConversionPublicResponse {
  ConversionQuote quote = 1;
}

message GetConversionQuotePublicRequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string quote_id = 3;
}

message GetConversionQuotePublicResponse {
  ConversionQuote quote = 1;
}

message FXSourcePair {
  int64 id = 1;
  string base_currency = 2;
  string quote_currency = 3;
  repeated string sides = 4;
}

message FXSource {
  string code = 1;
  string display_name = 2;
  string purpose = 3;
  string source_url = 4;
  int32 max_age_seconds = 5;
  repeated FXSourcePair pairs = 6;
}

message ListFXSourcesPublicRequest {
  string tenant_id = 1;
}

message ListFXSourcesPublicResponse {
  repeated FXSource sources = 1;
}
