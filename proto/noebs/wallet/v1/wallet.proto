syntax = "proto3";

package noebs.wallet.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/adonese/noebs/gen/proto/noebs/wallet/v1;walletv1";

service WalletInternalService {
  rpc GetWallet(GetWalletRequest) returns (Wallet) {}
  rpc EnsureWallet(EnsureWalletRequest) returns (Wallet) {}
  rpc ValidateP2P(ValidateP2PRequest) returns (ValidateP2PResponse) {}
  rpc RequestP2PTransfer(P2PTransferRequest) returns (WorkflowRun) {}
  rpc RequestDeposit(DepositRequest) returns (WorkflowRun) {}
  rpc RequestWithdrawal(WithdrawalRequest) returns (WorkflowRun) {}
  rpc RequestManualTransfer(ManualTransferRequest) returns (WorkflowRun) {}
  rpc SignalWithdrawalApproval(WithdrawalApprovalRequest) returns (google.protobuf.Empty) {}
  rpc SignalWithdrawalVerification(WithdrawalDestinationVerificationRequest) returns (google.protobuf.Empty) {}
  rpc SignalManualTransferDecision(ManualTransferDecisionRequest) returns (google.protobuf.Empty) {}
  rpc CreateFundingSource(CreateFundingSourceRequest) returns (FundingSource) {}
  rpc ListFundingSources(ListFundingSourcesRequest) returns (FundingSourceList) {}
  rpc CreateWithdrawalDestination(CreateWithdrawalDestinationRequest) returns (WithdrawalDestination) {}
  rpc ListWithdrawalDestinations(ListWithdrawalDestinationsRequest) returns (WithdrawalDestinationList) {}
  rpc DeactivateWithdrawalDestination(DeactivateWithdrawalDestinationRequest) returns (google.protobuf.Empty) {}
  rpc RequestOwnershipVerification(RequestOwnershipVerificationRequest) returns (OwnershipVerification) {}
  rpc CompleteOwnershipVerification(CompleteOwnershipVerificationRequest) returns (google.protobuf.Empty) {}
  rpc SetWalletPIN(SetWalletPINRequest) returns (google.protobuf.Empty) {}
  rpc ResetWalletPIN(ResetWalletPINRequest) returns (google.protobuf.Empty) {}
  rpc EnrollUser2FA(EnrollUser2FARequest) returns (User2FASetup) {}
  rpc ConfirmUser2FA(ConfirmUser2FARequest) returns (google.protobuf.Empty) {}
  rpc DisableUser2FA(DisableUser2FARequest) returns (google.protobuf.Empty) {}
}

service WalletPublicService {
  rpc GetWalletPublic(GetWalletRequest) returns (Wallet) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}"
    };
  }
  rpc EnsureWalletPublic(EnsureWalletRequest) returns (Wallet) {
    option (google.api.http) = {
      post: "/wallet"
      body: "*"
    };
  }
  rpc RequestP2PTransfer(P2PTransferRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/p2p"
      body: "*"
    };
  }
  rpc RequestDeposit(DepositRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/deposits"
      body: "*"
    };
  }
  rpc RequestManualTransfer(ManualTransferRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/manual_transfers"
      body: "*"
    };
  }
  rpc RequestWithdrawal(WithdrawalRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/withdrawals"
      body: "*"
    };
  }
  rpc SignalWithdrawalApproval(WithdrawalApprovalRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/withdrawals/{workflow_id}/approval"
      body: "*"
    };
  }
  rpc SignalWithdrawalVerification(WithdrawalDestinationVerificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/withdrawals/{workflow_id}/verification"
      body: "*"
    };
  }
  rpc SignalManualTransferDecision(ManualTransferDecisionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/manual_transfers/{workflow_id}/decision"
      body: "*"
    };
  }
  rpc ListFundingSources(ListFundingSourcesRequest) returns (FundingSourceList) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}/funding_sources"
    };
  }
  rpc CreateWithdrawalDestination(CreateWithdrawalDestinationRequest) returns (WithdrawalDestination) {
    option (google.api.http) = {
      post: "/wallet/{wallet_id}/destinations"
      body: "*"
    };
  }
  rpc ListWithdrawalDestinations(ListWithdrawalDestinationsRequest) returns (WithdrawalDestinationList) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}/destinations"
    };
  }
  rpc DeactivateWithdrawalDestination(DeactivateWithdrawalDestinationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/destinations/{destination_id}/deactivate"
      body: "*"
    };
  }
  rpc RequestOwnershipVerification(RequestOwnershipVerificationRequest) returns (OwnershipVerification) {
    option (google.api.http) = {
      post: "/wallet/destinations/{destination_id}/verify"
      body: "*"
    };
  }
  rpc CompleteOwnershipVerification(CompleteOwnershipVerificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/ownership_verifications/{verification_id}/complete"
      body: "*"
    };
  }
  rpc SetWalletPIN(SetWalletPINRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/{wallet_id}/pin"
      body: "*"
    };
  }
  rpc EnrollUser2FA(EnrollUser2FARequest) returns (User2FASetup) {
    option (google.api.http) = {
      post: "/wallet/users/{user_id}/2fa/enroll"
      body: "*"
    };
  }
  rpc ConfirmUser2FA(ConfirmUser2FARequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/users/{user_id}/2fa/confirm"
      body: "*"
    };
  }
  rpc DisableUser2FA(DisableUser2FARequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/users/{user_id}/2fa/disable"
      body: "*"
    };
  }
}

message Wallet {
  string id = 1;
  string tenant_id = 2;
  string owner_type = 3;
  string owner_id = 4;
  string currency = 5;
  int64 balance = 6;
  int64 available_balance = 7;
  string status = 8;
  string kyc_tier = 9;
}

message GetWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message EnsureWalletRequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string currency = 3;
}

message ValidateP2PRequest {
  string tenant_id = 1;
  string from_wallet_id = 2;
  string to_wallet_id = 3;
  string currency = 4;
  int64 amount = 5;
}

message ValidateP2PResponse {
  bool allowed = 1;
  string reason = 2;
  int64 total_debit = 3;
  int64 fee = 4;
}

message WorkflowRun {
  string workflow_id = 1;
  string run_id = 2;
}

message P2PTransferRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string currency = 3;
  string from_wallet_id = 4;
  string to_wallet_id = 5;
  int64 amount = 6;
  string description = 7;
  string reference_id = 8;
  string from_owner_type = 9;
  string from_owner_id = 10;
  string to_owner_type = 11;
  string to_owner_id = 12;
  int64 user_id = 13;
  string wallet_pin = 14;
  string two_fa_code = 15;
}

message DepositRequest {
  string tenant_id = 1;
  string client_reference = 2;
  string provider_code = 3;
  string wallet_id = 4;
  string owner_type = 5;
  string owner_id = 6;
  string psp_transaction_id = 7;
  int64 amount = 8;
  string currency = 9;
  optional int64 fee_amount = 10;
  optional int64 net_amount = 11;
  string idempotency_key = 12;
  google.protobuf.Struct metadata = 13;
  string region = 14;
}

message ManualTransferRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string transfer_type = 3;
  string wallet_id = 4;
  int64 amount = 5;
  string currency = 6;
  string reason = 7;
  int64 requested_by = 8;
  string psp_provider = 9;
  string psp_reference = 10;
  int32 approval_timeout_seconds = 11;
}

message ManualTransferDecisionRequest {
  string workflow_id = 1;
  bool approved = 2;
  int64 approver_id = 3;
  string reason = 4;
  string proof_of_payment = 5;
}

message WithdrawalRequest {
  string tenant_id = 1;
  string client_reference = 2;
  string provider_code = 3;
  string wallet_id = 4;
  int64 amount = 5;
  string currency = 6;
  int64 user_id = 7;
  string owner_type = 8;
  string owner_id = 9;
  int64 destination_id = 10;
  optional bool allow_return_to_source = 11;
  string wallet_pin = 12;
  string two_fa_code = 13;
  int32 hold_expiry_seconds = 14;
  int32 approval_timeout_seconds = 15;
  int32 verification_timeout_seconds = 16;
  string idempotency_key = 17;
  google.protobuf.Struct metadata = 18;
  string region = 19;
}

message WithdrawalApprovalRequest {
  string workflow_id = 1;
  bool approved = 2;
  int64 approver_id = 3;
  string reason = 4;
  string proof_of_payment = 5;
}

message WithdrawalDestinationVerificationRequest {
  string workflow_id = 1;
  int64 verification_id = 2;
  bool verified = 3;
  string reason = 4;
}

message FundingSource {
  int64 id = 1;
  string tenant_id = 2;
  string wallet_id = 3;
  string source_type = 4;
  string psp_provider = 5;
  string external_reference = 6;
  string verification_status = 7;
  string currency = 8;
  google.protobuf.Struct source_details = 9;
  int64 total_funded = 10;
  int64 total_withdrawn = 11;
  bool supports_withdrawal = 12;
  google.protobuf.Struct withdrawal_method = 13;
}

message FundingSourceList {
  repeated FundingSource sources = 1;
}

message CreateFundingSourceRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string source_type = 3;
  string psp_provider = 4;
  string external_reference = 5;
  string verification_status = 6;
  string currency = 7;
  google.protobuf.Struct source_details = 8;
  bool supports_withdrawal = 9;
  google.protobuf.Struct withdrawal_method = 10;
}

message ListFundingSourcesRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message WithdrawalDestination {
  int64 id = 1;
  string tenant_id = 2;
  string wallet_id = 3;
  string destination_type = 4;
  string psp_provider = 5;
  google.protobuf.Struct destination_details = 6;
  string display_name = 7;
  string currency = 8;
  string country = 9;
  string ownership_status = 10;
  string ownership_verification_method = 11;
  int64 linked_funding_source_id = 12;
  bool is_return_to_source = 13;
  bool is_active = 14;
  int64 total_withdrawn = 15;
}

message WithdrawalDestinationList {
  repeated WithdrawalDestination destinations = 1;
}

message CreateWithdrawalDestinationRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string destination_type = 3;
  string psp_provider = 4;
  google.protobuf.Struct destination_details = 5;
  string display_name = 6;
  string currency = 7;
  string country = 8;
  string ownership_verification_method = 9;
  int64 linked_funding_source_id = 10;
  bool is_return_to_source = 11;
}

message ListWithdrawalDestinationsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  bool active_only = 3;
}

message DeactivateWithdrawalDestinationRequest {
  string tenant_id = 1;
  int64 destination_id = 2;
}

message OwnershipVerification {
  int64 id = 1;
  string tenant_id = 2;
  int64 destination_id = 3;
  string verification_type = 4;
  string status = 5;
  int32 attempts = 6;
  int32 max_attempts = 7;
  string workflow_id = 8;
  string reference_id = 9;
}

message RequestOwnershipVerificationRequest {
  string tenant_id = 1;
  int64 destination_id = 2;
  string verification_type = 3;
  int32 verification_timeout_seconds = 4;
  string workflow_id = 5;
  string reference_id = 6;
}

message CompleteOwnershipVerificationRequest {
  string tenant_id = 1;
  int64 verification_id = 2;
  bool verified = 3;
  string reason = 4;
}

message SetWalletPINRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string new_pin = 3;
  string current_pin = 4;
}

message ResetWalletPINRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string new_pin = 3;
  int64 admin_id = 4;
}

message EnrollUser2FARequest {
  string tenant_id = 1;
  int64 user_id = 2;
}

message User2FASetup {
  string tenant_id = 1;
  int64 user_id = 2;
  string secret = 3;
  string otp_auth_url = 4;
  bool enabled = 5;
}

message ConfirmUser2FARequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string code = 3;
}

message DisableUser2FARequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string code = 3;
}
