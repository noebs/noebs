syntax = "proto3";

package noebs.wallet.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/adonese/noebs/gen/proto/noebs/wallet/v1;walletv1";

service WalletPublicService {
  rpc GetWalletPublic(GetWalletRequest) returns (Wallet) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}"
    };
  }
  rpc EnsureWalletPublic(EnsureWalletRequest) returns (Wallet) {
    option (google.api.http) = {
      post: "/wallet"
      body: "*"
    };
  }
  rpc ListPaymentMethodsPublic(ListPaymentMethodsRequest) returns (PaymentMethodList) {
    option (google.api.http) = {
      get: "/wallet/methods"
    };
  }
  rpc ListWalletTransactionsPublic(ListWalletTransactionsRequest) returns (WalletLedgerEntryList) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}/transactions"
    };
  }
  rpc RequestP2PTransfer(P2PTransferRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/p2p"
      body: "*"
    };
  }
  rpc RequestDeposit(DepositRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/deposits"
      body: "*"
    };
  }
  rpc RequestWithdrawal(WithdrawalRequest) returns (WorkflowRun) {
    option (google.api.http) = {
      post: "/wallet/withdrawals"
      body: "*"
    };
  }
  rpc ListFundingSources(ListFundingSourcesRequest) returns (FundingSourceList) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}/funding_sources"
    };
  }
  rpc CreateWithdrawalDestination(CreateWithdrawalDestinationRequest) returns (WithdrawalDestination) {
    option (google.api.http) = {
      post: "/wallet/{wallet_id}/destinations"
      body: "*"
    };
  }
  rpc ListWithdrawalDestinations(ListWithdrawalDestinationsRequest) returns (WithdrawalDestinationList) {
    option (google.api.http) = {
      get: "/wallet/{wallet_id}/destinations"
    };
  }
  rpc DeactivateWithdrawalDestination(DeactivateWithdrawalDestinationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/destinations/{destination_id}/deactivate"
      body: "*"
    };
  }
  rpc RequestOwnershipVerification(RequestOwnershipVerificationRequest) returns (OwnershipVerification) {
    option (google.api.http) = {
      post: "/wallet/destinations/{destination_id}/verify"
      body: "*"
    };
  }
  rpc CompleteOwnershipVerification(CompleteOwnershipVerificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/wallet/ownership_verifications/{verification_id}/complete"
      body: "*"
    };
  }
}

service WalletAdminService {
  rpc RenderWalletAdmin(AdminWalletRequest) returns (AdminWalletResponse) {}
}

enum AdminWalletAction {
  ADMIN_WALLET_ACTION_UNSPECIFIED = 0;
  ADMIN_WALLET_ACTION_DASHBOARD = 1;
  ADMIN_WALLET_ACTION_LIST_WALLETS = 2;
  ADMIN_WALLET_ACTION_WALLET_DETAIL = 3;
  ADMIN_WALLET_ACTION_PENDING_APPROVALS = 4;
  ADMIN_WALLET_ACTION_LIST_AUDIT_EVENTS = 5;
  ADMIN_WALLET_ACTION_LIST_TRANSACTIONS = 6;
  ADMIN_WALLET_ACTION_TRANSACTION_DETAIL = 7;
  ADMIN_WALLET_ACTION_LIST_MANUAL_TRANSFERS = 8;
  ADMIN_WALLET_ACTION_SUBMIT_MANUAL_TRANSFER = 9;
  ADMIN_WALLET_ACTION_MANUAL_TRANSFER_DETAIL = 10;
  ADMIN_WALLET_ACTION_LIST_FEES = 11;
  ADMIN_WALLET_ACTION_CREATE_FEE = 12;
  ADMIN_WALLET_ACTION_LIST_RATES = 13;
  ADMIN_WALLET_ACTION_CREATE_RATE = 14;
  ADMIN_WALLET_ACTION_APPROVE_TRANSFER = 15;
  ADMIN_WALLET_ACTION_REJECT_TRANSFER = 16;
}

message AdminWalletRequest {
  AdminWalletAction action = 1;
  map<string, string> query = 2;
  map<string, string> form = 3;
  map<string, string> path = 4;
}

message AdminWalletResponse {
  int32 status_code = 1;
  string content_type = 2;
  bytes body = 3;
  string redirect_location = 4;
}

message Wallet {
  string id = 1;
  string tenant_id = 2;
  string owner_type = 3;
  string owner_id = 4;
  string currency = 5;
  int64 balance = 6;
  int64 available_balance = 7;
  string status = 8;
  string kyc_tier = 9;
  string created_at = 10;
  string updated_at = 11;
}

message GetWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message EnsureWalletRequest {
  string tenant_id = 1;
  int64 user_id = 2;
  string currency = 3;
}

message ListPaymentMethodsRequest {
  string tenant_id = 1;
  string direction = 2;
  string currency = 3;
  string region = 4;
  int64 amount = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message PaymentMethod {
  string provider_code = 1;
  string provider_name = 2;
  string display_name = 3;
  string method_type = 4;
  string direction = 5;
  repeated string currencies = 6;
  repeated string regions = 7;
  optional int64 min_amount = 8;
  optional int64 max_amount = 9;
  string input_schema_json = 10;
  string presentation_json = 11;
  bool supports_deposit = 12;
  bool supports_withdrawal = 13;
}

message PaymentMethodList {
  repeated PaymentMethod methods = 1;
}

message ListWalletTransactionsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string entry_type = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message WalletLedgerEntry {
  int64 id = 1;
  string tenant_id = 2;
  int64 transaction_id = 3;
  string wallet_id = 4;
  string entry_type = 5;
  int64 amount = 6;
  string currency = 7;
  int64 balance_after = 8;
  int64 wallet_sequence = 9;
  string status = 10;
  string reference_type = 11;
  optional string reference_id = 12;
  optional string description = 13;
  string metadata_json = 14;
  string created_at = 15;
}

message WalletLedgerEntryList {
  repeated WalletLedgerEntry transactions = 1;
}

message WorkflowRun {
  string workflow_id = 1;
  string run_id = 2;
}

message P2PTransferRequest {
  string tenant_id = 1;
  string idempotency_key = 2;
  string currency = 3;
  string from_wallet_id = 4;
  string to_wallet_id = 5;
  int64 amount = 6;
  string description = 7;
  string reference_id = 8;
  string from_owner_type = 9;
  string from_owner_id = 10;
  string to_owner_type = 11;
  string to_owner_id = 12;
}

message DepositRequest {
  string tenant_id = 1;
  string client_reference = 2;
  string provider_code = 3;
  string wallet_id = 4;
  string owner_type = 5;
  string owner_id = 6;
  string psp_transaction_id = 7;
  int64 amount = 8;
  string currency = 9;
  optional int64 fee_amount = 10;
  optional int64 net_amount = 11;
  string idempotency_key = 12;
  google.protobuf.Struct metadata = 13;
  string region = 14;
}

message WithdrawalRequest {
  string tenant_id = 1;
  string client_reference = 2;
  string provider_code = 3;
  string wallet_id = 4;
  int64 amount = 5;
  string currency = 6;
  string owner_type = 8;
  string owner_id = 9;
  int64 destination_id = 10;
  optional bool allow_return_to_source = 11;
  int32 hold_expiry_seconds = 14;
  int32 approval_timeout_seconds = 15;
  int32 verification_timeout_seconds = 16;
  string idempotency_key = 17;
  google.protobuf.Struct metadata = 18;
  string region = 19;
}

message FundingSource {
  int64 id = 1;
  string tenant_id = 2;
  string wallet_id = 3;
  string source_type = 4;
  string psp_provider = 5;
  string external_reference = 6;
  string verification_status = 7;
  string currency = 8;
  google.protobuf.Struct source_details = 9;
  int64 total_funded = 10;
  int64 total_withdrawn = 11;
  bool supports_withdrawal = 12;
  google.protobuf.Struct withdrawal_method = 13;
}

message FundingSourceList {
  repeated FundingSource sources = 1;
}

message CreateFundingSourceRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string source_type = 3;
  string psp_provider = 4;
  string external_reference = 5;
  string verification_status = 6;
  string currency = 7;
  google.protobuf.Struct source_details = 8;
  bool supports_withdrawal = 9;
  google.protobuf.Struct withdrawal_method = 10;
}

message ListFundingSourcesRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message WithdrawalDestination {
  int64 id = 1;
  string tenant_id = 2;
  string wallet_id = 3;
  string destination_type = 4;
  string psp_provider = 5;
  google.protobuf.Struct destination_details = 6;
  string display_name = 7;
  string currency = 8;
  string country = 9;
  string ownership_status = 10;
  string ownership_verification_method = 11;
  int64 linked_funding_source_id = 12;
  bool is_return_to_source = 13;
  bool is_active = 14;
  int64 total_withdrawn = 15;
}

message WithdrawalDestinationList {
  repeated WithdrawalDestination destinations = 1;
}

message CreateWithdrawalDestinationRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string destination_type = 3;
  string psp_provider = 4;
  google.protobuf.Struct destination_details = 5;
  string display_name = 6;
  string currency = 7;
  string country = 8;
  string ownership_verification_method = 9;
  int64 linked_funding_source_id = 10;
  bool is_return_to_source = 11;
}

message ListWithdrawalDestinationsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  bool active_only = 3;
}

message DeactivateWithdrawalDestinationRequest {
  string tenant_id = 1;
  int64 destination_id = 2;
}

message OwnershipVerification {
  int64 id = 1;
  string tenant_id = 2;
  int64 destination_id = 3;
  string verification_type = 4;
  string status = 5;
  int32 attempts = 6;
  int32 max_attempts = 7;
  string workflow_id = 8;
  string reference_id = 9;
}

message RequestOwnershipVerificationRequest {
  string tenant_id = 1;
  int64 destination_id = 2;
  string verification_type = 3;
  int32 verification_timeout_seconds = 4;
  string workflow_id = 5;
  string reference_id = 6;
}

message CompleteOwnershipVerificationRequest {
  string tenant_id = 1;
  int64 verification_id = 2;
  bool verified = 3;
  string reason = 4;
}
