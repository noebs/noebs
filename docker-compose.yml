name: noebs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

x-web-hardening: &web-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,noexec,nosuid,nodev,size=16m
  pids_limit: 200
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

x-migrate-defaults: &migrate-defaults
  <<: [*service-defaults, *web-hardening]
  build:
    context: .
  init: true
  depends_on:
    db:
      condition: service_healthy
  secrets:
    - source: noebs_secrets
      target: /app/secrets.yaml
      uid: "10001"
      gid: "10001"
      mode: 0400
    - source: sops_age_key
      target: /app/.sops/age-key.txt
      uid: "10001"
      gid: "10001"
      mode: 0400
  networks:
    - backend
  restart: "no"
  user: "10001:10001"

services:
  runtime-init:
    <<: *service-defaults
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /app/runtime && chown -R 10001:10001 /app/runtime"]
    volumes:
      - noebs-runtime:/app/runtime
    restart: "no"

  secrets-init:
    <<: *service-defaults
    build:
      context: .
    entrypoint: ["/usr/local/bin/noebs", "render-config"]
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - noebs-runtime:/app/runtime
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
      - source: sops_age_key
        target: /app/.sops/age-key.txt
    restart: "no"

  db:
    <<: *service-defaults
    image: postgres:16
    init: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: noebs
      POSTGRES_DB: noebs
      POSTGRES_PASSWORD_FILE: /app/runtime/postgres_password.txt
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - noebs-postgres:/var/lib/postgresql/data
      - noebs-runtime:/app/runtime:ro
      - ./deploy/docker/postgres/001-service-databases.sql:/docker-entrypoint-initdb.d/001-service-databases.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  temporal-postgres:
    <<: *service-defaults
    image: postgres:16
    init: true
    environment:
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  temporal:
    <<: *service-defaults
    image: temporalio/auto-setup:1.29.1
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:7233:7233"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7233' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  temporal-ui:
    <<: *service-defaults
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"
    networks:
      - backend

  keycloak-postgres:
    <<: *service-defaults
    image: postgres:16
    init: true
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    secrets:
      - source: keycloak_postgres_password
        target: keycloak_postgres_password
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  keycloak:
    <<: [*service-defaults, *web-hardening]
    image: quay.io/keycloak/keycloak:26.6.1
    init: true
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    command: ["start"]
    ports:
      - "127.0.0.1:8082:8080"
    secrets:
      - source: keycloak_config
        target: /opt/keycloak/conf/keycloak.conf
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    user: "1000:1000"

  identity-auth-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/identity-auth-migrate.yaml:/app/service.yaml:ro"

  card-vault-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/card-vault-migrate.yaml:/app/service.yaml:ro"

  ebs-adapter-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/ebs-adapter-migrate.yaml:/app/service.yaml:ro"

  psp-webhook-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/psp-webhook-migrate.yaml:/app/service.yaml:ro"

  admin-reporting-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting-migrate.yaml:/app/service.yaml:ro"

  notification-chat-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/notification-chat-migrate.yaml:/app/service.yaml:ro"

  consumer-beneficiary-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/consumer-beneficiary-migrate.yaml:/app/service.yaml:ro"

  wallet-ledger-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-ledger-migrate.yaml:/app/service.yaml:ro"

  api-gateway:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    ports:
      # `:8080` is a common host port and is already used on our server.
      # Keep the app listening on `:8080` in-container, but publish it on `:8081` on the host.
      - "0.0.0.0:8081:8080"
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/api-gateway.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
      - public
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  identity-auth:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      identity-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/identity-auth.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  card-vault:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      card-vault-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/card-vault.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
