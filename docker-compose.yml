    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      wallet-ledger:
        condition: service_healthy
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-api.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
