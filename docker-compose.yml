      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-ledger:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-ledger.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
