name: noebs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

x-web-hardening: &web-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,noexec,nosuid,nodev,size=16m
  pids_limit: 200
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  runtime-init:
    <<: *service-defaults
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /app/runtime && chown -R 10001:10001 /app/runtime"]
    volumes:
      - noebs-runtime:/app/runtime
    restart: "no"

  secrets-init:
    <<: *service-defaults
    build:
      context: .
    entrypoint: ["/usr/local/bin/noebs", "render-config"]
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    environment:
      NOEBS_RUNTIME_DIR: /app/runtime
      NOEBS_RENDER_DB_PASSWORD_FILE: /app/runtime/postgres_password.txt
      SOPS_AGE_KEY_FILE: /app/.sops/age-key.txt
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - noebs-runtime:/app/runtime
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
      - source: sops_age_key
        target: /app/.sops/age-key.txt
    restart: "no"

  db:
    <<: *service-defaults
    image: postgres:16
    init: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: noebs
      POSTGRES_DB: noebs
      POSTGRES_PASSWORD_FILE: /app/runtime/postgres_password.txt
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - noebs-postgres:/var/lib/postgresql/data
      - noebs-runtime:/app/runtime:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:8080"
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    environment:
      NOEBS_RUNTIME_DIR: /app/runtime
      SOPS_AGE_KEY_FILE: /app/.sops/age-key.txt
    networks:
      - backend
      - public
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public

volumes:
  noebs-postgres:
  noebs-runtime:
  caddy_data:
  caddy_config:

secrets:
  noebs_secrets:
    file: ./secrets.yaml
  sops_age_key:
    file: ./.sops/age-key.txt

networks:
  public:
  backend:
    internal: true
