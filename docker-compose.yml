  caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    depends_on:
      api-gateway:
        condition: service_healthy
      identity-auth:
        condition: service_healthy
      card-vault:
        condition: service_healthy
      ebs-adapter:
        condition: service_healthy
      wallet-api:
        condition: service_healthy
      psp-webhook:
        condition: service_healthy
      admin-reporting:
        condition: service_healthy
      notification-chat:
        condition: service_healthy
      consumer-beneficiary:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - backend

volumes:
  noebs-postgres:
  noebs-runtime:
  temporal-postgres:
  keycloak-postgres-data:
  caddy_data:
  caddy_config:

secrets:
  noebs_secrets:
    file: ./secrets.yaml
  sops_age_key:
    file: ./.sops/age-key.txt
  keycloak_config:
    file: ./deploy/docker/keycloak/keycloak.conf
  keycloak_postgres_password:
    file: ./deploy/docker/keycloak/postgres-password.txt

networks:
  public:
  backend:
    internal: true
