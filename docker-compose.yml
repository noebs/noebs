name: noebs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

x-web-hardening: &web-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,noexec,nosuid,nodev,size=16m
  pids_limit: 200
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

x-migrate-defaults: &migrate-defaults
  <<: [*service-defaults, *web-hardening]
  build:
    context: .
  init: true
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend
  restart: "no"
  user: "10001:10001"

x-api-gateway-secret: &api-gateway-secret
  source: api-gateway-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-identity-auth-secret: &identity-auth-secret
  source: identity-auth-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-card-vault-secret: &card-vault-secret
  source: card-vault-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-ebs-adapter-secret: &ebs-adapter-secret
  source: ebs-adapter-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-psp-webhook-secret: &psp-webhook-secret
  source: psp-webhook-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-admin-reporting-secret: &admin-reporting-secret
  source: admin-reporting-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-notification-chat-secret: &notification-chat-secret
  source: notification-chat-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-wallet-api-secret: &wallet-api-secret
  source: wallet-api-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-wallet-ledger-secret: &wallet-ledger-secret
  source: wallet-ledger-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-wallet-worker-secret: &wallet-worker-secret
  source: wallet-worker-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

services:
  db:
    <<: *service-defaults
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    init: true
    entrypoint: ["/bin/bash", "/opt/noebs-postgres/bin/start.sh"]
    volumes:
      - noebs-postgres:/var/lib/postgresql/data
      - ./deploy/docker/postgres/postgres-start.sh:/opt/noebs-postgres/bin/start.sh:ro
      - ./deploy/docker/postgres/001-service-databases.sql:/opt/noebs-postgres/init/001-service-databases.sql:ro
    secrets:
      - source: service-role-passwords
        target: service-role-passwords
      - source: noebs_postgres_transport_ca_certificate
        target: /opt/noebs-postgres/secrets/ca.pem
      - source: noebs_postgres_tls_certificate
        target: /opt/noebs-postgres/secrets/tls.crt
      - source: noebs_postgres_tls_private_key
        target: /opt/noebs-postgres/secrets/tls.key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  kafka:
    <<: *service-defaults
    image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    init: true
    entrypoint: ["/bin/bash", "/opt/noebs-kafka/bin/start.sh"]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./deploy/docker/kafka/server.properties:/mnt/shared/config/server.properties:ro
      - ./deploy/docker/kafka/cluster.id:/mnt/shared/config/cluster.id:ro
      - ./deploy/docker/kafka/start.sh:/opt/noebs-kafka/bin/start.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-topics:
    <<: *service-defaults
    image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    init: true
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/noebs-kafka/bin/create-topics.sh"]
    volumes:
      - ./deploy/docker/kafka/bootstrap-server:/mnt/shared/config/bootstrap-server:ro
      - ./deploy/docker/kafka/topics.txt:/mnt/shared/config/topics.txt:ro
      - ./deploy/docker/kafka/create-topics.sh:/opt/noebs-kafka/bin/create-topics.sh:ro
    networks:
      - backend
    restart: "no"

  temporal-postgres:
    <<: *service-defaults
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    init: true
    entrypoint: ["/bin/bash", "/opt/temporal-postgres/bin/start.sh"]
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
      - ./deploy/docker/temporal/postgres-start.sh:/opt/temporal-postgres/bin/start.sh:ro
    secrets:
      - source: temporal_postgres_password
        target: /opt/temporal-postgres/secrets/password
      - source: temporal_postgres_tls_certificate
        target: /opt/temporal-postgres/secrets/tls.crt
      - source: temporal_postgres_tls_private_key
        target: /opt/temporal-postgres/secrets/tls.key
    networks:
      - temporal-storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  temporal-schema-migrate:
    <<: *service-defaults
    image: temporalio/auto-setup@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    depends_on:
      temporal-postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/temporal/bin/schema-migrate.sh"]
    volumes:
      - ./deploy/docker/temporal/schema-migrate.sh:/opt/temporal/bin/schema-migrate.sh:ro
    secrets:
      - source: temporal_postgres_password
        target: /opt/temporal/secrets/postgres-password
      - source: temporal_transport_ca_certificate
        target: /opt/temporal/secrets/postgres-ca.pem
    networks:
      - temporal-storage
    restart: "no"

  temporal:
    <<: *service-defaults
    image: temporalio/auto-setup@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    depends_on:
      temporal-schema-migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/temporal/bin/temporal-start.sh"]
    volumes:
      - ./deploy/docker/temporal/temporal-start.sh:/opt/temporal/bin/temporal-start.sh:ro
      - ./deploy/docker/temporal/temporal.yaml:/opt/temporal/config/temporal.yaml:ro
      - ./deploy/docker/temporal/dynamicconfig.yaml:/opt/temporal/config/dynamicconfig/docker.yaml:ro
    secrets:
      - source: temporal_postgres_password
        target: /opt/temporal/secrets/postgres-password
      - source: temporal_transport_ca_certificate
        target: /opt/temporal/secrets/postgres-ca.pem
      - source: temporal_tls_certificate
        target: /opt/temporal/secrets/tls.crt
      - source: temporal_tls_private_key
        target: /opt/temporal/secrets/tls.key
      - source: keycloak_transport_ca_certificate
        target: /opt/temporal/secrets/keycloak-ca.pem
    networks:
      temporal-control:
        aliases:
          - temporal-frontend
      temporal-storage:
      temporal-keycloak:
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7233' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  temporal-namespace-bootstrap:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint:
      - /usr/local/bin/noebs
      - ensure-temporal-namespace
      - --address
      - temporal-frontend:7233
      - --token-url
      - https://keycloak:8443/auth/realms/noebs/protocol/openid-connect/token
      - --temporal-ca
      - /etc/noebs-temporal/ca.pem
      - --keycloak-ca
      - /etc/noebs-keycloak/ca.pem
      - --client-secret
      - /etc/noebs-temporal/client-secret
    secrets:
      - source: temporal_transport_ca_certificate
        target: /etc/noebs-temporal/ca.pem
      - source: keycloak_transport_ca_certificate
        target: /etc/noebs-keycloak/ca.pem
      - source: temporal_namespace_bootstrap_client_secret
        target: /etc/noebs-temporal/client-secret
    networks:
      - temporal-control
      - temporal-keycloak
    restart: "no"

  keycloak-postgres:
    <<: *service-defaults
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    init: true
    entrypoint: ["/bin/bash", "/opt/keycloak-postgres/bin/start.sh"]
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/keycloak/postgres-start.sh:/opt/keycloak-postgres/bin/start.sh:ro
    secrets:
      - source: keycloak_postgres_password
        target: /opt/keycloak-postgres/secrets/password
      - source: keycloak_postgres_tls_certificate
        target: /opt/keycloak-postgres/secrets/tls.crt
      - source: keycloak_postgres_tls_private_key
        target: /opt/keycloak-postgres/secrets/tls.key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  keycloak:
    <<: [*service-defaults, *web-hardening]
    image: quay.io/keycloak/keycloak@sha256:2eb3cd316835c990e69e26ade292ffa78f6fb0db7d5fc6377463c162e1979ac0
    init: true
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    command: ["start"]
    secrets:
      - source: keycloak_config
        target: /opt/keycloak/conf/keycloak.conf
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: keycloak_transport_ca_certificate
        target: /opt/keycloak/conf/db-ca.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: keycloak_tls_certificate
        target: /opt/keycloak/conf/tls.crt
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: keycloak_tls_private_key
        target: /opt/keycloak/conf/tls.key
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - backend
      - temporal-keycloak
    stop_grace_period: 30s
    user: "1000:1000"

  workload-auth-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/workload-auth-migrate.yaml:/app/service.yaml:ro"
    secrets:
      - source: workload-auth-migrate-secrets
        target: /app/secrets.yaml

  workload-auth-cleanup:
    <<: *migrate-defaults
    depends_on:
      workload-auth-migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/noebs/recurring-cleanup.sh"]
    restart: unless-stopped
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/workload-auth-cleanup.yaml:/app/service.yaml:ro"
      - "./deploy/docker/recurring-cleanup.sh:/opt/noebs/recurring-cleanup.sh:ro"
    secrets:
      - source: workload-auth-cleanup-secrets
        target: /app/secrets.yaml

  gateway-auth-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/gateway-auth-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: gateway-auth-migrate-secrets
        target: /app/secrets.yaml

  gateway-auth-cleanup:
    <<: *migrate-defaults
    depends_on:
      gateway-auth-migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/noebs/recurring-cleanup.sh"]
    restart: unless-stopped
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/gateway-auth-cleanup.yaml:/app/service.yaml:ro"
      - "./deploy/docker/recurring-cleanup.sh:/opt/noebs/recurring-cleanup.sh:ro"
    secrets:
      - source: gateway-auth-cleanup-secrets
        target: /app/secrets.yaml

  identity-auth-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/identity-auth-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: identity-auth-migrate-secrets
        target: /app/secrets.yaml

  card-vault-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/card-vault-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: card-vault-migrate-secrets
        target: /app/secrets.yaml

  ebs-adapter-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/ebs-adapter-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: ebs-adapter-migrate-secrets
        target: /app/secrets.yaml

  admin-reporting-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: admin-reporting-migrate-secrets
        target: /app/secrets.yaml

  notification-chat-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/notification-chat-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: notification-chat-migrate-secrets
        target: /app/secrets.yaml

  wallet-ledger-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-ledger-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: wallet-ledger-migrate-secrets
        target: /app/secrets.yaml

  api-gateway:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      gateway-auth-migrate:
        condition: service_completed_successfully
    ports:
      # `:8080` is a common host port and is already used on our server.
      # Keep the local stack reachable without creating another public edge.
      - "127.0.0.1:8081:8080"
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/api-gateway.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - *api-gateway-secret
    networks:
      - backend
      - public
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  identity-auth:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      identity-auth-migrate:
        condition: service_completed_successfully
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/identity-auth.yaml:/app/service.yaml:ro"
    secrets:
      - *identity-auth-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  card-vault:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      card-vault-migrate:
        condition: service_completed_successfully
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/card-vault.yaml:/app/service.yaml:ro"
    secrets:
      - *card-vault-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  ebs-adapter:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      ebs-adapter-migrate:
        condition: service_completed_successfully
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/ebs-adapter.yaml:/app/service.yaml:ro"
    secrets:
      - *ebs-adapter-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  ebs-adapter-events:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      ebs-adapter-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/ebs-adapter-events.yaml:/app/service.yaml:ro"
    secrets:
      - source: ebs-adapter-events-secrets
        target: /app/secrets.yaml
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-api:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      wallet-ledger:
        condition: service_healthy
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-api.yaml:/app/service.yaml:ro"
    secrets:
      - *wallet-api-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  psp-webhook:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/psp-webhook.yaml:/app/service.yaml:ro"
    secrets:
      - *psp-webhook-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  admin-reporting:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      admin-reporting-migrate:
        condition: service_completed_successfully
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting.yaml:/app/service.yaml:ro"
    secrets:
      - *admin-reporting-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  admin-reporting-projector:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      admin-reporting-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting-projector.yaml:/app/service.yaml:ro"
    secrets:
      - source: admin-reporting-projector-secrets
        target: /app/secrets.yaml
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  notification-chat:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      notification-chat-migrate:
        condition: service_completed_successfully
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/notification-chat.yaml:/app/service.yaml:ro"
    secrets:
      - *notification-chat-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/noebs", "internal-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-ledger:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      temporal-namespace-bootstrap:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-ledger.yaml:/app/service.yaml:ro"
    secrets:
      - *wallet-ledger-secret
    networks:
      - backend
      - temporal-control
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-worker:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      temporal-namespace-bootstrap:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-worker.yaml:/app/service.yaml:ro"
    secrets:
      - *wallet-worker-secret
    networks:
      - backend
      - temporal-control
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

