    build:
      context: .
    init: true
    depends_on:
      consumer-beneficiary-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/consumer-beneficiary.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
