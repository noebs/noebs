name: noebs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

x-web-hardening: &web-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,noexec,nosuid,nodev,size=16m
  pids_limit: 200
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  runtime-init:
    <<: *service-defaults
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /app/runtime && chown -R 10001:10001 /app/runtime"]
    volumes:
      - noebs-runtime:/app/runtime
    restart: "no"

  secrets-init:
    <<: *service-defaults
    build:
      context: .
    entrypoint: ["/usr/local/bin/noebs", "render-config"]
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - noebs-runtime:/app/runtime
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
      - source: sops_age_key
        target: /app/.sops/age-key.txt
    restart: "no"

  db:
    <<: *service-defaults
    image: postgres:16
    init: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: noebs
      POSTGRES_DB: noebs
      POSTGRES_PASSWORD_FILE: /app/runtime/postgres_password.txt
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - noebs-postgres:/var/lib/postgresql/data
      - noebs-runtime:/app/runtime:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  temporal-postgres:
    <<: *service-defaults
    image: postgres:16
    init: true
    environment:
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  temporal:
    <<: *service-defaults
    image: temporalio/auto-setup:1.29.1
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:7233:7233"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7233' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  temporal-ui:
    <<: *service-defaults
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"
    networks:
      - backend

  noebs-migrate:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/migrate.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    restart: "no"
    user: "10001:10001"

  api-gateway:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      noebs-migrate:
        condition: service_completed_successfully
    ports:
      # `:8080` is a common host port and is already used on our server.
      # Keep the app listening on `:8080` in-container, but publish it on `:8081` on the host.
      - "0.0.0.0:8081:8080"
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/api-gateway.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
      - public
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  psp-webhook:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      noebs-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/psp-webhook.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  admin-reporting:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      noebs-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  notification-chat:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      noebs-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/notification-chat.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-ledger:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      noebs-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-ledger.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-worker:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      noebs-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-worker.yaml:/app/service.yaml:ro"
    secrets:
      - source: noebs_secrets
        target: /app/secrets.yaml
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: sops_age_key
        target: /app/.sops/age-key.txt
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    user: "10001:10001"

  caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    depends_on:
      api-gateway:
        condition: service_healthy
      psp-webhook:
        condition: service_healthy
      admin-reporting:
        condition: service_healthy
      notification-chat:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - backend

volumes:
  noebs-postgres:
  noebs-runtime:
  temporal-postgres:
  caddy_data:
  caddy_config:

secrets:
  noebs_secrets:
    file: ./secrets.yaml
  sops_age_key:
    file: ./.sops/age-key.txt

networks:
  public:
  backend:
    internal: true
