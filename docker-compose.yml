name: noebs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

x-web-hardening: &web-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /run:rw,noexec,nosuid,nodev,size=16m
  pids_limit: 200
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

x-migrate-defaults: &migrate-defaults
  <<: [*service-defaults, *web-hardening]
  build:
    context: .
  init: true
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend
  restart: "no"
  user: "10001:10001"

x-sops-age-key-secret: &sops-age-key-secret
  source: sops_age_key
  target: /app/.sops/age-key.txt
  uid: "10001"
  gid: "10001"
  mode: 0400

x-api-gateway-secret: &api-gateway-secret
  source: api-gateway-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-identity-auth-secret: &identity-auth-secret
  source: identity-auth-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-card-vault-secret: &card-vault-secret
  source: card-vault-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-ebs-adapter-secret: &ebs-adapter-secret
  source: ebs-adapter-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-psp-webhook-secret: &psp-webhook-secret
  source: psp-webhook-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-admin-reporting-secret: &admin-reporting-secret
  source: admin-reporting-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-notification-chat-secret: &notification-chat-secret
  source: notification-chat-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-wallet-api-secret: &wallet-api-secret
  source: wallet-api-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-wallet-ledger-secret: &wallet-ledger-secret
  source: wallet-ledger-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

x-wallet-worker-secret: &wallet-worker-secret
  source: wallet-worker-secrets
  target: /app/secrets.yaml
  uid: "10001"
  gid: "10001"
  mode: 0400

services:
  runtime-init:
    <<: *service-defaults
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /app/runtime && chown -R 10001:10001 /app/runtime"]
    volumes:
      - noebs-runtime:/app/runtime
    restart: "no"

  secrets-init:
    <<: *service-defaults
    build:
      context: .
    entrypoint: ["/usr/local/bin/noebs", "render-db-password"]
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - noebs-runtime:/app/runtime
    secrets:
      - source: postgres-bootstrap-secrets
        target: /app/secrets.yaml
      - source: sops_age_key
        target: /app/.sops/age-key.txt
    restart: "no"

  db:
    <<: *service-defaults
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    init: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/noebs-postgres/bin/start.sh"]
    volumes:
      - noebs-postgres:/var/lib/postgresql/data
      - noebs-runtime:/opt/noebs-postgres/secrets:ro
      - ./deploy/docker/postgres/postgres-start.sh:/opt/noebs-postgres/bin/start.sh:ro
      - ./deploy/docker/postgres/001-service-databases.sql:/opt/noebs-postgres/init/001-service-databases.sql:ro
    secrets:
      - source: workload-auth-migrate-password
        target: workload-auth-migrate-password
      - source: workload-auth-runtime-password
        target: workload-auth-runtime-password
      - source: workload-auth-cleanup-password
        target: workload-auth-cleanup-password
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noebs -d noebs"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  kafka:
    <<: *service-defaults
    image: apache/kafka:3.9.1
    init: true
    entrypoint: ["/bin/bash", "/opt/noebs-kafka/bin/start.sh"]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./deploy/docker/kafka/server.properties:/mnt/shared/config/server.properties:ro
      - ./deploy/docker/kafka/cluster.id:/mnt/shared/config/cluster.id:ro
      - ./deploy/docker/kafka/start.sh:/opt/noebs-kafka/bin/start.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-topics:
    <<: *service-defaults
    image: apache/kafka:3.9.1
    init: true
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/noebs-kafka/bin/create-topics.sh"]
    volumes:
      - ./deploy/docker/kafka/bootstrap-server:/mnt/shared/config/bootstrap-server:ro
      - ./deploy/docker/kafka/topics.txt:/mnt/shared/config/topics.txt:ro
      - ./deploy/docker/kafka/create-topics.sh:/opt/noebs-kafka/bin/create-topics.sh:ro
    networks:
      - backend
    restart: "no"

  temporal-postgres:
    <<: *service-defaults
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    init: true
    entrypoint: ["/bin/bash", "/opt/temporal-postgres/bin/start.sh"]
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
      - ./deploy/docker/temporal/postgres-start.sh:/opt/temporal-postgres/bin/start.sh:ro
    secrets:
      - source: temporal_postgres_password
        target: /opt/temporal-postgres/secrets/password
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  temporal-schema-migrate:
    <<: *service-defaults
    image: temporalio/auto-setup:1.29.1
    depends_on:
      temporal-postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/temporal/bin/schema-migrate.sh"]
    volumes:
      - ./deploy/docker/temporal/schema-migrate.sh:/opt/temporal/bin/schema-migrate.sh:ro
    secrets:
      - source: temporal_postgres_password
        target: /opt/temporal/secrets/postgres-password
    networks:
      - backend
    restart: "no"

  temporal:
    <<: *service-defaults
    image: temporalio/auto-setup:1.29.1
    depends_on:
      temporal-schema-migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/temporal/bin/temporal-start.sh"]
    volumes:
      - ./deploy/docker/temporal/temporal-start.sh:/opt/temporal/bin/temporal-start.sh:ro
      - ./deploy/docker/temporal/temporal.yaml:/opt/temporal/config/temporal.yaml:ro
      - ./deploy/docker/temporal/dynamicconfig.yaml:/opt/temporal/config/dynamicconfig/docker.yaml:ro
    secrets:
      - source: temporal_postgres_password
        target: /opt/temporal/secrets/postgres-password
    networks:
      backend:
        aliases:
          - temporal-frontend
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7233' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  temporal-namespace-bootstrap:
    <<: *service-defaults
    image: temporalio/auto-setup:1.29.1
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/temporal/bin/namespace-bootstrap.sh"]
    volumes:
      - ./deploy/docker/temporal/namespace-bootstrap.sh:/opt/temporal/bin/namespace-bootstrap.sh:ro
    networks:
      - backend
    restart: "no"

  temporal-ui:
    <<: *service-defaults
    image: temporalio/ui:2.34.0
    depends_on:
      temporal-namespace-bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/home/ui-server/ui-server", "--root", "/home/ui-server", "--config", "config", "start"]
    volumes:
      - ./deploy/docker/temporal/ui.yaml:/home/ui-server/config/development.yaml:ro
    networks:
      - backend

  keycloak-postgres:
    <<: *service-defaults
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    init: true
    entrypoint: ["/bin/bash", "/opt/keycloak-postgres/bin/start.sh"]
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/keycloak/postgres-start.sh:/opt/keycloak-postgres/bin/start.sh:ro
    secrets:
      - source: keycloak_postgres_password
        target: /opt/keycloak-postgres/secrets/password
      - source: keycloak_postgres_tls_certificate
        target: /opt/keycloak-postgres/secrets/tls.crt
      - source: keycloak_postgres_tls_private_key
        target: /opt/keycloak-postgres/secrets/tls.key
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  keycloak:
    <<: [*service-defaults, *web-hardening]
    image: quay.io/keycloak/keycloak@sha256:2eb3cd316835c990e69e26ade292ffa78f6fb0db7d5fc6377463c162e1979ac0
    init: true
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    command: ["start"]
    secrets:
      - source: keycloak_config
        target: /opt/keycloak/conf/keycloak.conf
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: keycloak_transport_ca_certificate
        target: /opt/keycloak/conf/db-ca.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: keycloak_tls_certificate
        target: /opt/keycloak/conf/tls.crt
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: keycloak_tls_private_key
        target: /opt/keycloak/conf/tls.key
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - backend
    stop_grace_period: 30s
    user: "1000:1000"

  workload-auth-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/workload-auth-migrate.yaml:/app/service.yaml:ro"
    secrets:
      - source: workload-auth-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  workload-auth-cleanup:
    <<: *migrate-defaults
    depends_on:
      workload-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/workload-auth-cleanup.yaml:/app/service.yaml:ro"
    secrets:
      - source: workload-auth-cleanup-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  identity-auth-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/identity-auth-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: identity-auth-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  card-vault-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/card-vault-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: card-vault-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  ebs-adapter-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/ebs-adapter-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: ebs-adapter-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  psp-webhook-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/psp-webhook-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: psp-webhook-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  admin-reporting-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: admin-reporting-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  notification-chat-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/notification-chat-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: notification-chat-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  wallet-ledger-migrate:
    <<: *migrate-defaults
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-ledger-migrate.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - source: wallet-ledger-migrate-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret

  api-gateway:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    ports:
      # `:8080` is a common host port and is already used on our server.
      # Keep the local stack reachable without creating another public edge.
      - "127.0.0.1:8081:8080"
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/api-gateway.yaml:/app/service.yaml:ro"
      - "./deploy/kubernetes/keycloak-authority/tenant-catalog.yaml:/app/tenant-catalog.yaml:ro"
    secrets:
      - *api-gateway-secret
      - *sops-age-key-secret
    networks:
      - backend
      - public
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  identity-auth:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      identity-auth-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/identity-auth.yaml:/app/service.yaml:ro"
    secrets:
      - *identity-auth-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  card-vault:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      card-vault-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/card-vault.yaml:/app/service.yaml:ro"
    secrets:
      - *card-vault-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  ebs-adapter:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      ebs-adapter-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/ebs-adapter.yaml:/app/service.yaml:ro"
    secrets:
      - *ebs-adapter-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  ebs-adapter-events:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      ebs-adapter-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/ebs-adapter-events.yaml:/app/service.yaml:ro"
    secrets:
      - source: ebs-adapter-events-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-api:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      wallet-ledger:
        condition: service_healthy
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-api.yaml:/app/service.yaml:ro"
    secrets:
      - *wallet-api-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  psp-webhook:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      psp-webhook-migrate:
        condition: service_completed_successfully
      temporal-namespace-bootstrap:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/psp-webhook.yaml:/app/service.yaml:ro"
    secrets:
      - *psp-webhook-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  admin-reporting:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      admin-reporting-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting.yaml:/app/service.yaml:ro"
    secrets:
      - *admin-reporting-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  admin-reporting-projector:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      admin-reporting-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/admin-reporting-projector.yaml:/app/service.yaml:ro"
    secrets:
      - source: admin-reporting-projector-secrets
        target: /app/secrets.yaml
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  notification-chat:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      notification-chat-migrate:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/notification-chat.yaml:/app/service.yaml:ro"
    secrets:
      - *notification-chat-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-ledger:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      temporal-namespace-bootstrap:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-ledger.yaml:/app/service.yaml:ro"
    secrets:
      - *wallet-ledger-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

  wallet-worker:
    <<: [*service-defaults, *web-hardening]
    build:
      context: .
    init: true
    depends_on:
      wallet-ledger-migrate:
        condition: service_completed_successfully
      temporal-namespace-bootstrap:
        condition: service_completed_successfully
    volumes:
      - "./config.docker.yaml:/app/config.yaml:ro"
      - "./deploy/docker/services/wallet-worker.yaml:/app/service.yaml:ro"
    secrets:
      - *wallet-worker-secret
      - *sops-age-key-secret
    networks:
      - backend
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/test || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    user: "10001:10001"

