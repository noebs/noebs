noebs:
  service_role: api-gateway
  port: ":8080"
  is_debug: false
  # Only enable for local/dev when the EBS endpoint uses a self-signed cert.
  ebs_insecure_skip_verify: false
  cors:
    - "*"
  # Optional outbound callback (disabled when empty).
  consumer_biller_hooks_url: ""
  temporal_enabled: false
  temporal_host: "localhost"
  temporal_port: "7233"
  temporal_namespace: "default"
  wallet_enabled: false
  wallet_pin_required: true
  wallet_2fa_threshold: 10000
  wallet_approval_threshold: 100000
  wallet_default_currency: "USD"
  wallet_hold_expiry_seconds: 3600
  wallet_approval_timeout_seconds: 3600
  wallet_verification_timeout_seconds: 86400
  wallet_manual_approval_timeout_seconds: 86400
  wallet_psp_poller_cron: "*/5 * * * *"
  wallet_psp_poller_batch_size: 100
  wallet_psp_poller_interval_seconds: 300
  wallet_reconciliation_cron: "0 3 * * *"
  wallet_reconciliation_batch_size: 500
  wallet_reconciliation_lookback_hours: 24
  grpc_enabled: false
  grpc_port: ":9090"
  grpc_gateway_enabled: false
  grpc_gateway_port: ":9091"

litestream:
  dbs:
    - path: /data/noebs.db
      replicas:
        - type: s3
          bucket: litestream-dbs
          path: noebs
          endpoint: https://6806c24e30d8129e3570ea9825d21eed.r2.cloudflarestorage.com
          force-path-style: true
          sync-interval: 10s
          retention: 168h
          snapshot-interval: 1h
