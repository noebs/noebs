api_version: noebs.sd/keycloak/v1
realm:
  name: noebs
  display_name: Noebs
  access_token_lifespan_seconds: 300
  sso_session_idle_timeout_seconds: 1800
  sso_session_max_lifespan_seconds: 28800
  revoke_refresh_token: true
  refresh_token_max_reuse: 0
authentication:
  browser_flow: noebs-browser
  first_broker_login_flow: noebs-first-broker-login
  post_broker_login_flow: noebs-google-otp
  otp:
    type: totp
    algorithm: HmacSHA256
    initial_counter: 0
    digits: 6
    look_ahead_window: 1
    period_seconds: 30
    reusable: false
    configure_required_action:
      alias: CONFIGURE_TOTP
      enabled: true
      default_action: true
      priority: 10
reconciler_client:
  client_id: noebs-keycloak-reconciler
  name: Noebs Keycloak Reconciler
  credential: noebs-keycloak-reconciler
  realm_management_roles:
    - realm-admin
resource_client:
  client_id: noebs-api
  name: Noebs API
  roles:
    - name: user
      description: Tenant user
    - name: backoffice
      description: Tenant back-office operator
    - name: tenant-admin
      description: Tenant administrator
    - name: reporting:read
      description: Read tenant reports
    - name: wallet:read
      description: Read tenant wallet state
    - name: wallet:audit:read
      description: Audit tenant wallet activity
    - name: wallet:manual:create
      description: Create manual operations
    - name: wallet:fees:write
      description: Change tenant fee configuration
    - name: wallet:rates:write
      description: Change tenant rate configuration
    - name: wallet:workflow:approve
      description: Approve tenant workflows
    - name: wallet:workflow:reject
      description: Reject tenant workflows
interactive_clients:
  - client_id: noebs-mobile
    name: Noebs Mobile
    access_type: public
    credential: ""
    redirect_uris:
      - https://api.noebs.sd/mobile/oauth/callback
    post_logout_redirect_uris: []
    web_origins: []
  - client_id: noebs-backoffice
    name: Noebs Backoffice
    access_type: confidential
    credential: noebs-backoffice
    redirect_uris:
      - https://api.noebs.sd/backoffice/oauth/callback
    post_logout_redirect_uris:
      - https://api.noebs.sd/backoffice/oauth/logout/callback
    web_origins: []
realm_roles: []
organization_claim:
  client_scope: organization
  mapper_name: noebs-organization-groups
  protocol_mapper: oidc-organization-group-membership-mapper
  config:
    id.token.claim: "false"
    access.token.claim: "true"
    lightweight.claim: "false"
    userinfo.token.claim: "false"
    introspection.token.claim: "false"
    addGroupRoleMappings: "true"
identity_providers:
  - alias: google
    display_name: Google
    provider_id: google
    credential: google
    config:
      defaultScope: openid profile email
      issuer: https://accounts.google.com
      syncMode: IMPORT
organizations:
  - alias: tenant-cutover
    name: Tenant Cutover
    attributes: {}
    groups:
      - name: user
        description: Tenant users
        attributes: {}
        client_roles:
          - user
      - name: backoffice
        description: Tenant back-office operators
        attributes: {}
        client_roles:
          - backoffice
          - reporting:read
          - wallet:read
          - wallet:audit:read
      - name: tenant-admin
        description: Tenant administrators
        attributes: {}
        client_roles:
          - tenant-admin
          - reporting:read
          - wallet:read
          - wallet:audit:read
          - wallet:manual:create
          - wallet:fees:write
          - wallet:rates:write
          - wallet:workflow:approve
          - wallet:workflow:reject
  - alias: tenant-sandbox
    name: Tenant Sandbox
    attributes: {}
    groups:
      - name: user
        description: Tenant users
        attributes: {}
        client_roles:
          - user
      - name: backoffice
        description: Tenant back-office operators
        attributes: {}
        client_roles:
          - backoffice
          - reporting:read
          - wallet:read
          - wallet:audit:read
      - name: tenant-admin
        description: Tenant administrators
        attributes: {}
        client_roles:
          - tenant-admin
          - reporting:read
          - wallet:read
          - wallet:audit:read
          - wallet:manual:create
          - wallet:fees:write
          - wallet:rates:write
          - wallet:workflow:approve
          - wallet:workflow:reject
