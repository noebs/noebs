apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noebs

# This overlay is for the first sync of an empty Keycloak database only. The
# steady current-host overlay contains no temporary master-realm credential.
resources:
  - ../current-host
  - delete-bootstrap-client-job.yaml

images:
  # Match only the bootstrap Job; preserve the SDK digest inherited below.
  - name: noebs-bootstrap
    newName: ghcr.io/noebs/noebs
    digest: sha256:5c4d73c6a8163df5383a282c334f2ad10c9946f9eb7391f3cbf537d9b3f59f29

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: KC_BOOTSTRAP_ADMIN_CLIENT_ID
            value: noebs-keycloak-bootstrap
          - name: KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: keycloak-bootstrap-admin
                key: client-secret
  - target:
      group: batch
      version: v1
      kind: Job
      name: noebs-keycloak-reconciler
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: noebs-keycloak-reconciler
      spec:
        template:
          spec:
            volumes:
              - name: credentials
                secret:
                  secretName: keycloak-bootstrap-reconciler-credentials
