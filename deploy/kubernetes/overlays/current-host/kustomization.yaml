apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/noebs/noebs
    newName: ghcr.io/noebs/noebs
    digest: sha256:e30ee74b49f91514de71bad3f99578f996ad8327b0ea720f2c441b2d3fe245d4
  - name: postgres
    newName: docker.io/library/postgres
    digest: sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
  - name: apache/kafka
    newName: docker.io/apache/kafka
    digest: sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
  - name: quay.io/keycloak/keycloak
    newName: quay.io/keycloak/keycloak
    digest: sha256:2eb3cd316835c990e69e26ade292ffa78f6fb0db7d5fc6377463c162e1979ac0
  - name: temporalio/auto-setup
    newName: docker.io/temporalio/auto-setup
    digest: sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (api-gateway|card-vault|identity-auth)
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (admin-reporting|api-gateway|card-vault|ebs-adapter|identity-auth|notification-chat|psp-webhook|wallet-api|wallet-ledger)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (admin-reporting-projector|ebs-adapter-events|wallet-worker)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 512Mi
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: (postgres|temporal-postgres)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: keycloak-postgres
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: kafka
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: "1500m"
            memory: 1536Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: temporal
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 1536Mi
  - target:
      group: batch
      version: v1
      kind: Job
      name: (noebs-deployment-preflight|noebs-keycloak-reconciler|noebs-.*-migrate)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - target:
      group: batch
      version: v1
      kind: Job
      name: (kafka-topics|temporal-schema-migrate|temporal-namespace-bootstrap)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: (noebs-workload-auth-cleanup|noebs-gateway-auth-cleanup)
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
  - target:
      kind: (Deployment|Job)
      name: (admin-reporting|admin-reporting-projector|api-gateway|card-vault|ebs-adapter|ebs-adapter-events|identity-auth|notification-chat|psp-webhook|wallet-api|wallet-ledger|wallet-worker|noebs-.*-migrate)
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-postgres
            image: ghcr.io/noebs/noebs:master
            imagePullPolicy: IfNotPresent
            command: [/bin/bash, -ec]
            args:
              - |
                until timeout 2 bash -c 'exec 3<>/dev/tcp/postgres/5432' 2>/dev/null; do
                  sleep 1
                done
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: (noebs-workload-auth-cleanup|noebs-gateway-auth-cleanup)
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/initContainers
        value:
          - name: wait-for-postgres
            image: ghcr.io/noebs/noebs:master
            imagePullPolicy: IfNotPresent
            command: [/bin/bash, -ec]
            args:
              - |
                until timeout 2 bash -c 'exec 3<>/dev/tcp/postgres/5432' 2>/dev/null; do
                  sleep 1
                done
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
