apiVersion: v1
kind: Service
metadata:
  name: noebs-mojaloop-sdk
spec:
  selector: {app.kubernetes.io/name: wallet-worker}
  ports: [{name: fspiop, port: 4000, targetPort: 4000}]
---
apiVersion: v1
kind: Service
metadata:
  name: noebs-mojaloop-redis
spec:
  selector: {app.kubernetes.io/name: noebs-mojaloop-redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: noebs-mojaloop-redis
  annotations: {argocd.argoproj.io/sync-wave: "10"}
spec:
  serviceName: noebs-mojaloop-redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: noebs-mojaloop-redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: noebs-mojaloop-redis}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999}
      containers:
        - name: redis
          image: redis@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
          args: [redis-server, --appendonly, "yes", --appendfsync, always, --save, "", --maxmemory, 128mb, --maxmemory-policy, noeviction]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: noebs-mojaloop-redis}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: noebs-mojaloop-redis}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: wallet-worker}}}]
      ports: [{protocol: TCP, port: 6379}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: noebs-mojaloop-worker}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: wallet-worker}
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the host relay can forward native FSPIOP callbacks. The SDK outbound
    # listener and Go backend additionally bind literally to 127.0.0.1.
    - from: [{ipBlock: {cidr: 10.42.0.1/32}}]
      ports: [{protocol: TCP, port: 4000}]
  egress:
    - to: [{ipBlock: {cidr: 172.30.250.1/32}}]
      ports: [{protocol: TCP, port: 4040}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: noebs-mojaloop-redis}}}]
      ports: [{protocol: TCP, port: 6379}]
