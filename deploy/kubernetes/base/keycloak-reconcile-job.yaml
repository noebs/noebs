apiVersion: batch/v1
kind: Job
metadata:
  name: noebs-keycloak-reconcile
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: keycloak-reconciler
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-reconciler
    spec:
      serviceAccountName: keycloak-reconciler
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: reconcile
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/noebs
          args:
            - reconcile-keycloak
            - --desired-state
            - /etc/noebs-keycloak/desired-state.yaml
            - --config
            - /etc/noebs-keycloak-reconciler/config.yaml
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: desired-state
              mountPath: /etc/noebs-keycloak/desired-state.yaml
              subPath: keycloak-desired-state.yaml
              readOnly: true
            - name: credentials
              mountPath: /etc/noebs-keycloak-reconciler/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: desired-state
          configMap:
            name: keycloak-desired-state
        - name: credentials
          secret:
            secretName: keycloak-reconciler-credentials
