apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-bootstrap
  labels:
    app.kubernetes.io/name: postgres
data:
  start.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    pgdata="/var/lib/postgresql/data"
    postgres_user="noebs"
    password_source="/opt/noebs-postgres/secrets/password"
    password_runtime="/tmp/noebs-postgres-password"
    service_database_sql="/opt/noebs-postgres/init/001-service-databases.sql"
    pgpass="/var/lib/postgresql/.pgpass"

    cleanup() {
      rm -f "$password_runtime" "$pgpass"
    }
    trap cleanup EXIT

    pgpass_escape() {
      local value="$1"
      value="${value//\\/\\\\}"
      value="${value//:/\\:}"
      printf '%s' "$value"
    }

    if [ ! -s "$password_source" ]; then
      echo "missing Noebs Postgres password file: $password_source" >&2
      exit 1
    fi
    if [ ! -s "$service_database_sql" ]; then
      echo "missing Noebs service database SQL file: $service_database_sql" >&2
      exit 1
    fi

    install -d -o postgres -g postgres -m 0700 "$pgdata"

    if [ ! -s "$pgdata/PG_VERSION" ]; then
      password="$(tr -d '\r\n' < "$password_source")"
      printf '%s\n' "$password" > "$password_runtime"
      chown postgres:postgres "$password_runtime"
      chmod 0600 "$password_runtime"

      gosu postgres initdb \
        -D "$pgdata" \
        --auth-host=scram-sha-256 \
        --auth-local=scram-sha-256 \
        --username="$postgres_user" \
        --pwfile="$password_runtime"

      {
        echo
        echo "host all all all scram-sha-256"
      } >> "$pgdata/pg_hba.conf"

      printf '/tmp:5432:*:%s:%s\n' "$(pgpass_escape "$postgres_user")" "$(pgpass_escape "$password")" > "$pgpass"
      chown postgres:postgres "$pgpass"
      chmod 0600 "$pgpass"

      gosu postgres pg_ctl \
        -D "$pgdata" \
        -o "-c listen_addresses='' -c unix_socket_directories=/tmp" \
        -w start
      gosu postgres psql \
        "host=/tmp dbname=postgres user=$postgres_user passfile=$pgpass" \
        --set=ON_ERROR_STOP=1 \
        --file="$service_database_sql"
      gosu postgres pg_ctl -D "$pgdata" -m fast -w stop
    fi

    exec gosu postgres postgres -D "$pgdata" -c listen_addresses='*'
  001-service-databases.sql: |
    SELECT 'CREATE DATABASE identity_auth OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'identity_auth')\gexec
    SELECT 'CREATE DATABASE card_vault OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'card_vault')\gexec
    SELECT 'CREATE DATABASE ebs_adapter OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ebs_adapter')\gexec
    SELECT 'CREATE DATABASE psp_webhook OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'psp_webhook')\gexec
    SELECT 'CREATE DATABASE admin_reporting OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'admin_reporting')\gexec
    SELECT 'CREATE DATABASE notification_chat OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notification_chat')\gexec
    SELECT 'CREATE DATABASE consumer_beneficiary OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'consumer_beneficiary')\gexec
    SELECT 'CREATE DATABASE wallet_ledger OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'wallet_ledger')\gexec
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/noebs-postgres/bin/start.sh
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - noebs
                - -d
                - postgres
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - noebs
                - -d
                - postgres
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - noebs
                - -d
                - postgres
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: postgres-bootstrap
              mountPath: /opt/noebs-postgres/bin/start.sh
              subPath: start.sh
              readOnly: true
            - name: postgres-bootstrap
              mountPath: /opt/noebs-postgres/init/001-service-databases.sql
              subPath: 001-service-databases.sql
              readOnly: true
            - name: postgres-credentials
              mountPath: /opt/noebs-postgres/secrets/password
              subPath: password
              readOnly: true
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-bootstrap
          configMap:
            name: postgres-bootstrap
            defaultMode: 0555
        - name: postgres-credentials
          secret:
            secretName: postgres-credentials
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
