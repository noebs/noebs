apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-bootstrap
  labels:
    app.kubernetes.io/name: postgres
data:
  start.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    pgdata="/var/lib/postgresql/data"
    postgres_user="noebs"
    password_source="/opt/noebs-postgres/secrets/password"
    tls_certificate_source="/opt/noebs-postgres/secrets/tls.crt"
    tls_private_key_source="/opt/noebs-postgres/secrets/tls.key"
    migrate_password_source="/run/secrets/workload-auth-migrate-password"
    runtime_password_source="/run/secrets/workload-auth-runtime-password"
    cleanup_password_source="/run/secrets/workload-auth-cleanup-password"
    gateway_migrate_password_source="/run/secrets/gateway-auth-migrate-password"
    gateway_runtime_password_source="/run/secrets/gateway-auth-runtime-password"
    gateway_cleanup_password_source="/run/secrets/gateway-auth-cleanup-password"
    password_runtime="/tmp/noebs-postgres-password"
    service_database_sql="/opt/noebs-postgres/init/001-service-databases.sql"
    pgpass="/var/lib/postgresql/.pgpass"

    cleanup() {
      rm -f "$password_runtime" "$pgpass"
    }
    trap cleanup EXIT

    pgpass_escape() {
      local value="$1"
      value="${value//\\/\\\\}"
      value="${value//:/\\:}"
      printf '%s' "$value"
    }

    if [ ! -s "$password_source" ]; then
      echo "missing Noebs Postgres password file: $password_source" >&2
      exit 1
    fi
    for role_password_source in \
      "$migrate_password_source" \
      "$runtime_password_source" \
      "$cleanup_password_source" \
      "$gateway_migrate_password_source" \
      "$gateway_runtime_password_source" \
      "$gateway_cleanup_password_source"; do
      if [ ! -s "$role_password_source" ]; then
        echo "missing Postgres role password file: $role_password_source" >&2
        exit 1
      fi
    done
    if [ ! -s "$service_database_sql" ]; then
      echo "missing Noebs service database SQL file: $service_database_sql" >&2
      exit 1
    fi

    if [ ! -s "$tls_certificate_source" ] || [ ! -s "$tls_private_key_source" ]; then
      echo "missing Noebs Postgres TLS certificate or private key" >&2
      exit 1
    fi

    install -d -o postgres -g postgres -m 0700 "$pgdata"
    password="$(tr -d '\r\n' < "$password_source")"
    export NOEBS_WORKLOAD_AUTH_MIGRATE_PASSWORD="$(tr -d '\r\n' < "$migrate_password_source")"
    export NOEBS_WORKLOAD_AUTH_RUNTIME_PASSWORD="$(tr -d '\r\n' < "$runtime_password_source")"
    export NOEBS_WORKLOAD_AUTH_CLEANUP_PASSWORD="$(tr -d '\r\n' < "$cleanup_password_source")"
    export NOEBS_GATEWAY_AUTH_MIGRATE_PASSWORD="$(tr -d '\r\n' < "$gateway_migrate_password_source")"
    export NOEBS_GATEWAY_AUTH_RUNTIME_PASSWORD="$(tr -d '\r\n' < "$gateway_runtime_password_source")"
    export NOEBS_GATEWAY_AUTH_CLEANUP_PASSWORD="$(tr -d '\r\n' < "$gateway_cleanup_password_source")"

    if [ ! -s "$pgdata/PG_VERSION" ]; then
      printf '%s\n' "$password" > "$password_runtime"
      chown postgres:postgres "$password_runtime"
      chmod 0600 "$password_runtime"

      gosu postgres initdb \
        -D "$pgdata" \
        --auth-host=scram-sha-256 \
        --auth-local=scram-sha-256 \
        --username="$postgres_user" \
        --pwfile="$password_runtime"

    fi

    sed -i \
      -e '/^# noebs managed host auth begin$/,/^# noebs managed host auth end$/d' \
      -e '/^[[:space:]]*host[[:space:]]/d' \
      -e '/^[[:space:]]*hostssl[[:space:]]/d' \
      -e '/^[[:space:]]*hostnossl[[:space:]]/d' \
      "$pgdata/pg_hba.conf"
    {
      echo "# noebs managed host auth begin"
      echo "hostssl all all all scram-sha-256"
      echo "hostnossl all all all reject"
      echo "# noebs managed host auth end"
    } >> "$pgdata/pg_hba.conf"

    printf '/tmp:5432:*:%s:%s\n' "$(pgpass_escape "$postgres_user")" "$(pgpass_escape "$password")" > "$pgpass"
    chown postgres:postgres "$pgpass"
    chmod 0600 "$pgpass"

    gosu postgres pg_ctl \
      -D "$pgdata" \
      -o "-c listen_addresses='' -c unix_socket_directories=/tmp" \
      -w start
    gosu postgres psql \
      "host=/tmp dbname=postgres user=$postgres_user passfile=$pgpass" \
      --set=ON_ERROR_STOP=1 \
      --file="$service_database_sql"
    gosu postgres pg_ctl -D "$pgdata" -m fast -w stop

    unset NOEBS_WORKLOAD_AUTH_MIGRATE_PASSWORD
    unset NOEBS_WORKLOAD_AUTH_RUNTIME_PASSWORD
    unset NOEBS_WORKLOAD_AUTH_CLEANUP_PASSWORD
    unset NOEBS_GATEWAY_AUTH_MIGRATE_PASSWORD
    unset NOEBS_GATEWAY_AUTH_RUNTIME_PASSWORD
    unset NOEBS_GATEWAY_AUTH_CLEANUP_PASSWORD

    exec gosu postgres postgres \
      -D "$pgdata" \
      -c "listen_addresses=*" \
      -c "ssl=on" \
      -c "ssl_min_protocol_version=TLSv1.3" \
      -c "ssl_max_protocol_version=TLSv1.3" \
      -c "ssl_cert_file=$tls_certificate_source" \
      -c "ssl_key_file=$tls_private_key_source"
  001-service-databases.sql: |
    \getenv workload_auth_migrate_password NOEBS_WORKLOAD_AUTH_MIGRATE_PASSWORD
    \getenv workload_auth_runtime_password NOEBS_WORKLOAD_AUTH_RUNTIME_PASSWORD
    \getenv workload_auth_cleanup_password NOEBS_WORKLOAD_AUTH_CLEANUP_PASSWORD
    \getenv gateway_auth_migrate_password NOEBS_GATEWAY_AUTH_MIGRATE_PASSWORD
    \getenv gateway_auth_runtime_password NOEBS_GATEWAY_AUTH_RUNTIME_PASSWORD
    \getenv gateway_auth_cleanup_password NOEBS_GATEWAY_AUTH_CLEANUP_PASSWORD

    SELECT format('CREATE ROLE workload_auth_migrate LOGIN PASSWORD %L', :'workload_auth_migrate_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'workload_auth_migrate')\gexec
    SELECT format('ALTER ROLE workload_auth_migrate WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'workload_auth_migrate_password')\gexec
    SELECT format('CREATE ROLE workload_auth_runtime LOGIN PASSWORD %L', :'workload_auth_runtime_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'workload_auth_runtime')\gexec
    SELECT format('ALTER ROLE workload_auth_runtime WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'workload_auth_runtime_password')\gexec
    SELECT format('CREATE ROLE workload_auth_cleanup LOGIN PASSWORD %L', :'workload_auth_cleanup_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'workload_auth_cleanup')\gexec
    SELECT format('ALTER ROLE workload_auth_cleanup WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'workload_auth_cleanup_password')\gexec

    SELECT format('CREATE ROLE gateway_auth_migrate LOGIN PASSWORD %L', :'gateway_auth_migrate_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'gateway_auth_migrate')\gexec
    SELECT format('ALTER ROLE gateway_auth_migrate WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'gateway_auth_migrate_password')\gexec
    SELECT format('CREATE ROLE gateway_auth_runtime LOGIN PASSWORD %L', :'gateway_auth_runtime_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'gateway_auth_runtime')\gexec
    SELECT format('ALTER ROLE gateway_auth_runtime WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'gateway_auth_runtime_password')\gexec
    SELECT format('CREATE ROLE gateway_auth_cleanup LOGIN PASSWORD %L', :'gateway_auth_cleanup_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'gateway_auth_cleanup')\gexec
    SELECT format('ALTER ROLE gateway_auth_cleanup WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'gateway_auth_cleanup_password')\gexec

    SELECT 'CREATE DATABASE identity_auth OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'identity_auth')\gexec
    SELECT 'CREATE DATABASE card_vault OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'card_vault')\gexec
    SELECT 'CREATE DATABASE ebs_adapter OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ebs_adapter')\gexec
    SELECT 'CREATE DATABASE psp_webhook OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'psp_webhook')\gexec
    SELECT 'CREATE DATABASE admin_reporting OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'admin_reporting')\gexec
    SELECT 'CREATE DATABASE notification_chat OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notification_chat')\gexec
    SELECT 'CREATE DATABASE wallet_ledger OWNER noebs'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'wallet_ledger')\gexec
    SELECT 'CREATE DATABASE workload_auth OWNER workload_auth_migrate'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'workload_auth')\gexec
    GRANT CONNECT ON DATABASE workload_auth TO workload_auth_runtime, workload_auth_cleanup;
    SELECT 'CREATE DATABASE gateway_auth OWNER gateway_auth_migrate'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'gateway_auth')\gexec
    GRANT CONNECT ON DATABASE gateway_auth TO gateway_auth_runtime, gateway_auth_cleanup;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/noebs-postgres/bin/start.sh
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - noebs
                - -d
                - postgres
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - noebs
                - -d
                - postgres
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - noebs
                - -d
                - postgres
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: postgres-bootstrap
              mountPath: /opt/noebs-postgres/bin/start.sh
              subPath: start.sh
              readOnly: true
            - name: postgres-bootstrap
              mountPath: /opt/noebs-postgres/init/001-service-databases.sql
              subPath: 001-service-databases.sql
              readOnly: true
            - name: postgres-credentials
              mountPath: /opt/noebs-postgres/secrets/password
              subPath: password
              readOnly: true
            - name: postgres-credentials
              mountPath: /opt/noebs-postgres/secrets/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: postgres-credentials
              mountPath: /opt/noebs-postgres/secrets/tls.key
              subPath: tls.key
              readOnly: true
            - name: workload-auth-postgres-roles
              mountPath: /run/secrets/workload-auth-migrate-password
              subPath: migrate-password
              readOnly: true
            - name: workload-auth-postgres-roles
              mountPath: /run/secrets/workload-auth-runtime-password
              subPath: runtime-password
              readOnly: true
            - name: workload-auth-postgres-roles
              mountPath: /run/secrets/workload-auth-cleanup-password
              subPath: cleanup-password
              readOnly: true
            - name: gateway-auth-postgres-roles
              mountPath: /run/secrets/gateway-auth-migrate-password
              subPath: migrate-password
              readOnly: true
            - name: gateway-auth-postgres-roles
              mountPath: /run/secrets/gateway-auth-runtime-password
              subPath: runtime-password
              readOnly: true
            - name: gateway-auth-postgres-roles
              mountPath: /run/secrets/gateway-auth-cleanup-password
              subPath: cleanup-password
              readOnly: true
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-bootstrap
          configMap:
            name: postgres-bootstrap
            defaultMode: 0555
        - name: postgres-credentials
          secret:
            secretName: postgres-credentials
            defaultMode: 0440
        - name: workload-auth-postgres-roles
          secret:
            secretName: workload-auth-postgres-roles
        - name: gateway-auth-postgres-roles
          secret:
            secretName: gateway-auth-postgres-roles
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
