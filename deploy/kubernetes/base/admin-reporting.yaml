apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-reporting
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: admin-reporting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-reporting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-reporting
    spec:
      serviceAccountName: admin-reporting
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: admin-reporting
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /test
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /test
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: admin-reporting.service.yaml
              readOnly: true
            - name: admin-reporting-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            - name: sops-age-key
              mountPath: /app/.sops/age-key.txt
              subPath: age-key.txt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: admin-reporting-secrets
          secret:
            secretName: admin-reporting-secrets
        - name: sops-age-key
          secret:
            secretName: sops-age-key
---
apiVersion: v1
kind: Service
metadata:
  name: admin-reporting
  labels:
    app.kubernetes.io/name: admin-reporting
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-reporting
  ports:
    - name: http
      port: 8080
      targetPort: http
