apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-api
  labels:
    app.kubernetes.io/name: wallet-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: wallet-api
          image: ghcr.io/adonese/noebs:master
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /test
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /test
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: wallet-api.service.yaml
              readOnly: true
            - name: noebs-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            - name: sops-age-key
              mountPath: /app/.sops/age-key.txt
              subPath: age-key.txt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: noebs-secrets
          secret:
            secretName: noebs-secrets
        - name: sops-age-key
          secret:
            secretName: sops-age-key
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-api
  labels:
    app.kubernetes.io/name: wallet-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wallet-api
  ports:
    - name: http
      port: 8080
      targetPort: http
