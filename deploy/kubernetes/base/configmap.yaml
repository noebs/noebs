apiVersion: v1
kind: ConfigMap
metadata:
  name: noebs-config
data:
  config.yaml: |
    noebs:
      sops_age_key_file: /app/.sops/age-key.txt
      runtime_dir: /app/runtime
      db_driver: pgx
      port: ":8080"
      is_debug: false
      ebs_insecure_skip_verify: false
      cors:
        - "https://api.noebs.sd"
        - "https://dsa.adonese.sd"
      consumer_biller_hooks_url: ""
      temporal_enabled: true
      temporal_host: "temporal-frontend"
      temporal_port: "7233"
      temporal_namespace: "default"
      wallet_enabled: true
      wallet_pin_required: true
      wallet_2fa_threshold: 10000
      wallet_approval_threshold: 100000
      wallet_default_currency: "SDG"
      wallet_hold_expiry_seconds: 3600
      wallet_approval_timeout_seconds: 3600
      wallet_verification_timeout_seconds: 86400
      wallet_manual_approval_timeout_seconds: 86400
      wallet_psp_poller_cron: "*/5 * * * *"
      wallet_psp_poller_batch_size: 100
      wallet_psp_poller_interval_seconds: 300
      wallet_reconciliation_cron: "0 3 * * *"
      wallet_reconciliation_batch_size: 500
      wallet_reconciliation_lookback_hours: 24
      grpc_enabled: true
      grpc_port: ":9090"
      grpc_gateway_enabled: false
      grpc_gateway_port: ":9091"
      service_discovery:
        identity-auth: "http://identity-auth:8080"
        keycloak: "http://keycloak:8080"
        card-vault: "http://card-vault:8080"
        ebs-adapter: "http://ebs-adapter:8080"
        psp-webhook: "http://psp-webhook:8080"
        admin-reporting: "http://admin-reporting:8080"
        notification-chat: "http://notification-chat:8080"
        consumer-beneficiary: "http://consumer-beneficiary:8080"
        wallet-api: "http://wallet-api:8080"
      grpc_service_discovery:
        wallet-ledger: "wallet-ledger:9090"
  api-gateway.service.yaml: |
    noebs:
      service_role: api-gateway
  identity-auth.service.yaml: |
    noebs:
      service_role: identity-auth
  card-vault.service.yaml: |
    noebs:
      service_role: card-vault
  ebs-adapter.service.yaml: |
    noebs:
      service_role: ebs-adapter
  psp-webhook.service.yaml: |
    noebs:
      service_role: psp-webhook
  admin-reporting.service.yaml: |
    noebs:
      service_role: admin-reporting
  notification-chat.service.yaml: |
    noebs:
      service_role: notification-chat
  consumer-beneficiary.service.yaml: |
    noebs:
      service_role: consumer-beneficiary
  wallet-api.service.yaml: |
    noebs:
      service_role: wallet-api
  wallet-ledger.service.yaml: |
    noebs:
      service_role: wallet-ledger
  wallet-worker.service.yaml: |
    noebs:
      service_role: wallet-worker
  identity-auth-migrate.service.yaml: |
    noebs:
      service_role: identity-auth-migrate
  card-vault-migrate.service.yaml: |
    noebs:
      service_role: card-vault-migrate
  ebs-adapter-migrate.service.yaml: |
    noebs:
      service_role: ebs-adapter-migrate
  psp-webhook-migrate.service.yaml: |
    noebs:
      service_role: psp-webhook-migrate
  admin-reporting-migrate.service.yaml: |
    noebs:
      service_role: admin-reporting-migrate
  notification-chat-migrate.service.yaml: |
    noebs:
      service_role: notification-chat-migrate
  consumer-beneficiary-migrate.service.yaml: |
    noebs:
      service_role: consumer-beneficiary-migrate
  wallet-ledger-migrate.service.yaml: |
    noebs:
      service_role: wallet-ledger-migrate
