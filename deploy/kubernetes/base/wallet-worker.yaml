apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-worker
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: wallet-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-worker
    spec:
      serviceAccountName: wallet-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: wallet-worker
          image: ghcr.io/adonese/noebs:master
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: wallet-worker.service.yaml
              readOnly: true
            - name: wallet-ledger-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            - name: sops-age-key
              mountPath: /app/.sops/age-key.txt
              subPath: age-key.txt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: wallet-ledger-secrets
          secret:
            secretName: wallet-ledger-secrets
        - name: sops-age-key
          secret:
            secretName: sops-age-key
