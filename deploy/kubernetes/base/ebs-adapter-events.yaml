apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebs-adapter-events
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: ebs-adapter-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ebs-adapter-events
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-adapter-events
    spec:
      serviceAccountName: ebs-adapter-events
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ebs-adapter-events
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: ebs-adapter-events.service.yaml
              readOnly: true
            - name: ebs-adapter-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            - name: sops-age-key
              mountPath: /app/.sops/age-key.txt
              subPath: age-key.txt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: ebs-adapter-secrets
          secret:
            secretName: ebs-adapter-secrets
        - name: sops-age-key
          secret:
            secretName: sops-age-key
