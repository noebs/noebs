apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api-gateway
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          ports:
            - name: https-internal
              containerPort: 8080
          readinessProbe:
            exec:
              command: ["/usr/local/bin/noebs", "internal-healthcheck"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/noebs", "internal-healthcheck"]
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: api-gateway.service.yaml
              readOnly: true
            - name: api-gateway-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: api-gateway-secrets
          secret:
            secretName: api-gateway-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: https-internal
      port: 8080
      targetPort: https-internal
