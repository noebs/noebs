apiVersion: batch/v1
kind: Job
metadata:
  name: noebs-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: noebs-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noebs-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ghcr.io/adonese/noebs:master
          imagePullPolicy: IfNotPresent
          env:
            - name: NOEBS_SERVICE
              value: migrate
            - name: NOEBS_RUNTIME_DIR
              value: /app/runtime
            - name: SOPS_AGE_KEY_FILE
              value: /app/.sops/age-key.txt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: noebs-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            - name: sops-age-key
              mountPath: /app/.sops/age-key.txt
              subPath: age-key.txt
              readOnly: true
            - name: runtime
              mountPath: /app/runtime
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: noebs-secrets
          secret:
            secretName: noebs-secrets
        - name: sops-age-key
          secret:
            secretName: sops-age-key
        - name: runtime
          emptyDir: {}
