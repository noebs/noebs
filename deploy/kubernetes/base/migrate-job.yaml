apiVersion: batch/v1
kind: Job
metadata:
  name: noebs-workload-auth-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/name: noebs-workload-auth-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noebs-workload-auth-migrate
    spec:
      serviceAccountName: workload-auth-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: workload-auth-migrate.service.yaml
              readOnly: true
            - name: workload-auth-migrate-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            - name: sops-age-key
              mountPath: /app/.sops/age-key.txt
              subPath: age-key.txt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: workload-auth-migrate-secrets
          secret:
            secretName: workload-auth-migrate-secrets
        - name: sops-age-key
          secret:
            secretName: sops-age-key
---
