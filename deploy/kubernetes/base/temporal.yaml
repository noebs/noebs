apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  labels:
    app.kubernetes.io/name: temporal-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
  labels:
    app.kubernetes.io/name: temporal-postgres
spec:
  serviceName: temporal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgres
    spec:
      serviceAccountName: temporal-postgres
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres-credentials
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - temporal
                - -d
                - temporal
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - temporal
                - -d
                - temporal
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: temporal-postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: temporal-postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  labels:
    app.kubernetes.io/name: temporal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      serviceAccountName: temporal
      automountServiceAccountToken: false
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres-credentials
                  key: password
            - name: POSTGRES_SEEDS
              value: temporal-postgres
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: TEMPORAL_CLI_ADDRESS
              value: temporal-frontend:7233
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  labels:
    app.kubernetes.io/name: temporal-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  labels:
    app.kubernetes.io/name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
    spec:
      serviceAccountName: temporal-ui
      automountServiceAccountToken: false
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.34.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
          ports:
            - name: http
              containerPort: 8080
