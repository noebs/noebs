apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  labels:
    app.kubernetes.io/name: temporal-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-postgres-bootstrap
  labels:
    app.kubernetes.io/name: temporal-postgres
data:
  start.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    pgdata="/var/lib/postgresql/data"
    postgres_user="temporal"
    postgres_db="temporal"
    visibility_db="temporal_visibility"
    password_source="/opt/temporal-postgres/secrets/password"
    password_runtime="/tmp/temporal-postgres-password"
    pgpass="/var/lib/postgresql/.pgpass"
    tls_certificate_source="/opt/temporal-postgres/secrets/tls.crt"
    tls_private_key_source="/opt/temporal-postgres/secrets/tls.key"
    tls_certificate_runtime="/tmp/temporal-postgres-tls.crt"
    tls_private_key_runtime="/tmp/temporal-postgres-tls.key"

    cleanup() {
      rm -f "$password_runtime" "$pgpass" "$tls_certificate_runtime" "$tls_private_key_runtime"
    }
    trap cleanup EXIT

    pgpass_escape() {
      local value="$1"
      value="${value//\\/\\\\}"
      value="${value//:/\\:}"
      printf '%s' "$value"
    }

    if [ ! -s "$password_source" ]; then
      echo "missing Temporal Postgres password file: $password_source" >&2
      exit 1
    fi
    for tls_source in "$tls_certificate_source" "$tls_private_key_source"; do
      if [ ! -s "$tls_source" ]; then
        echo "missing Temporal Postgres TLS input: $tls_source" >&2
        exit 1
      fi
    done

    install -d -o postgres -g postgres -m 0700 "$pgdata"
    install -o postgres -g postgres -m 0600 "$tls_certificate_source" "$tls_certificate_runtime"
    install -o postgres -g postgres -m 0600 "$tls_private_key_source" "$tls_private_key_runtime"

    if [ ! -s "$pgdata/PG_VERSION" ]; then
      password="$(tr -d '\r\n' < "$password_source")"
      printf '%s\n' "$password" > "$password_runtime"
      chown postgres:postgres "$password_runtime"
      chmod 0600 "$password_runtime"

      gosu postgres initdb \
        -D "$pgdata" \
        --auth-host=scram-sha-256 \
        --auth-local=scram-sha-256 \
        --username="$postgres_user" \
        --pwfile="$password_runtime"

      printf '/tmp:5432:*:%s:%s\n' "$(pgpass_escape "$postgres_user")" "$(pgpass_escape "$password")" > "$pgpass"
      chown postgres:postgres "$pgpass"
      chmod 0600 "$pgpass"

      gosu postgres pg_ctl \
        -D "$pgdata" \
        -o "-c listen_addresses='' -c unix_socket_directories=/tmp" \
        -w start
      gosu postgres psql \
        "host=/tmp dbname=postgres user=$postgres_user passfile=$pgpass" \
        --set=ON_ERROR_STOP=1 \
        --command="CREATE DATABASE $postgres_db"
      gosu postgres psql \
        "host=/tmp dbname=postgres user=$postgres_user passfile=$pgpass" \
        --set=ON_ERROR_STOP=1 \
        --command="CREATE DATABASE $visibility_db"
      gosu postgres pg_ctl -D "$pgdata" -m fast -w stop
    fi

    cat > "$pgdata/pg_hba.conf" <<'EOF'
    local all all scram-sha-256
    hostssl all all all scram-sha-256
    hostnossl all all all reject
    host all all all reject
    EOF
    chown postgres:postgres "$pgdata/pg_hba.conf"
    chmod 0600 "$pgdata/pg_hba.conf"

    exec gosu postgres postgres \
      -D "$pgdata" \
      -c listen_addresses='*' \
      -c ssl=on \
      -c ssl_min_protocol_version=TLSv1.3 \
      -c ssl_max_protocol_version=TLSv1.3 \
      -c "ssl_cert_file=$tls_certificate_runtime" \
      -c "ssl_key_file=$tls_private_key_runtime"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  labels:
    app.kubernetes.io/name: temporal
data:
  temporal.yaml: |
    log:
      stdout: true
      level: info

    persistence:
      numHistoryShards: 4
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: postgres12
            databaseName: temporal
            connectAddr: temporal-postgres:5432
            connectProtocol: tcp
            user: temporal
            password: __DATABASE_PASSWORD_FROM_FILE__
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /opt/temporal/secrets/postgres-ca.pem
              enableHostVerification: true
              serverName: temporal-postgres
        visibility:
          sql:
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-postgres:5432
            connectProtocol: tcp
            user: temporal
            password: __DATABASE_PASSWORD_FROM_FILE__
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /opt/temporal/secrets/postgres-ca.pem
              enableHostVerification: true
              serverName: temporal-postgres

    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: 127.0.0.1
      pprof:
        port: 0
      tls:
        frontend:
          server:
            certFile: /opt/temporal/secrets/tls.crt
            keyFile: /opt/temporal/secrets/tls.key
            requireClientAuth: false
      authorization:
        jwtKeyProvider:
          keySourceURIs:
            - https://keycloak.noebs.svc.cluster.local:8443/auth/realms/noebs/protocol/openid-connect/certs
          refreshInterval: 1m
        permissionsClaimName: permissions
        authorizer: default
        claimMapper: default
        audience: noebs-temporal

    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnIP: 0.0.0.0
          httpPort: 0
      internal-frontend:
        rpc:
          grpcPort: 7236
          membershipPort: 6936
          bindOnIP: 127.0.0.1
          httpPort: 0
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnIP: 127.0.0.1
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnIP: 127.0.0.1
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnIP: 127.0.0.1

    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: active
      currentClusterName: active
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: internal-frontend
          rpcAddress: 127.0.0.1:7236

    dcRedirectionPolicy:
      policy: noop

    archival:
      history:
        state: enabled
        enableRead: true
        provider:
          filestore:
            fileMode: "0666"
            dirMode: "0766"
      visibility:
        state: enabled
        enableRead: true
        provider:
          filestore:
            fileMode: "0666"
            dirMode: "0766"

    namespaceDefaults:
      archival:
        history:
          state: disabled
          URI: file:///tmp/temporal_archival/development
        visibility:
          state: disabled
          URI: file:///tmp/temporal_vis_archival/development

    dynamicConfigClient:
      filepath: /opt/temporal/config/dynamicconfig/docker.yaml
      pollInterval: 60s
  temporal-start.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    password_source="/opt/temporal/secrets/postgres-password"
    template_source="/opt/temporal/config/temporal.yaml"
    runtime_root="/tmp/temporal"
    runtime_config_dir="$runtime_root/config"
    runtime_config="$runtime_config_dir/development.yaml"
    export SSL_CERT_FILE="/opt/temporal/secrets/keycloak-ca.pem"

    read_required_file() {
      local label="$1"
      local path="$2"
      local value

      if [ ! -s "$path" ]; then
        echo "missing $label file: $path" >&2
        exit 1
      fi

      value="$(tr -d '\r\n' < "$path")"
      if [ -z "$value" ]; then
        echo "empty $label file: $path" >&2
        exit 1
      fi

      printf '%s' "$value"
    }

    sed_escape() {
      local value="$1"
      value="${value//\\/\\\\}"
      value="${value//&/\\&}"
      value="${value//|/\\|}"
      printf '%s' "$value"
    }

    if [ ! -s "$template_source" ]; then
      echo "missing Temporal config template: $template_source" >&2
      exit 1
    fi

    install -d -m 0700 "$runtime_config_dir"
    password="$(read_required_file "Temporal Postgres password" "$password_source")"
    sed \
      -e "s|__DATABASE_PASSWORD_FROM_FILE__|$(sed_escape "$password")|g" \
      "$template_source" > "$runtime_config"
    chmod 0600 "$runtime_config"

    exec temporal-server --root "$runtime_root" --config config start \
      --service frontend \
      --service internal-frontend \
      --service history \
      --service matching \
      --service worker
  schema-migrate.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    password_source="/opt/temporal/secrets/postgres-password"
    postgres_ca="/opt/temporal/secrets/postgres-ca.pem"
    postgres_host="temporal-postgres"
    postgres_port="5432"
    postgres_user="temporal"
    temporal_db="temporal"
    visibility_db="temporal_visibility"
    schema_root="/etc/temporal/schema/postgresql/v12"

    if [ ! -s "$password_source" ]; then
      echo "missing Temporal Postgres password file: $password_source" >&2
      exit 1
    fi
    if [ ! -s "$postgres_ca" ]; then
      echo "missing Temporal Postgres CA file: $postgres_ca" >&2
      exit 1
    fi

    password="$(tr -d '\r\n' < "$password_source")"

    until nc -z "$postgres_host" "$postgres_port"; do
      echo "waiting for Temporal Postgres at $postgres_host:$postgres_port"
      sleep 1
    done

    temporal-sql-tool \
      --plugin postgres12 \
      --endpoint "$postgres_host" \
      --port "$postgres_port" \
      --user "$postgres_user" \
      --password "$password" \
      --database "$temporal_db" \
      --tls=true \
      --tls-disable-host-verification=false \
      --tls-ca-file "$postgres_ca" \
      --tls-server-name "$postgres_host" \
      setup-schema -v 0.0
    temporal-sql-tool \
      --plugin postgres12 \
      --endpoint "$postgres_host" \
      --port "$postgres_port" \
      --user "$postgres_user" \
      --password "$password" \
      --database "$temporal_db" \
      --tls=true \
      --tls-disable-host-verification=false \
      --tls-ca-file "$postgres_ca" \
      --tls-server-name "$postgres_host" \
      update-schema -d "$schema_root/temporal/versioned"

    temporal-sql-tool \
      --plugin postgres12 \
      --endpoint "$postgres_host" \
      --port "$postgres_port" \
      --user "$postgres_user" \
      --password "$password" \
      --database "$visibility_db" \
      --tls=true \
      --tls-disable-host-verification=false \
      --tls-ca-file "$postgres_ca" \
      --tls-server-name "$postgres_host" \
      setup-schema -v 0.0
    temporal-sql-tool \
      --plugin postgres12 \
      --endpoint "$postgres_host" \
      --port "$postgres_port" \
      --user "$postgres_user" \
      --password "$password" \
      --database "$visibility_db" \
      --tls=true \
      --tls-disable-host-verification=false \
      --tls-ca-file "$postgres_ca" \
      --tls-server-name "$postgres_host" \
      update-schema -d "$schema_root/visibility/versioned"
  dynamicconfig.yaml: ""
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
  labels:
    app.kubernetes.io/name: temporal-postgres
spec:
  serviceName: temporal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgres
    spec:
      serviceAccountName: temporal-postgres
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/temporal-postgres/bin/start.sh
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - temporal
                - -d
                - temporal
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - temporal
                - -d
                - temporal
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - temporal
                - -d
                - temporal
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: temporal-postgres-bootstrap
              mountPath: /opt/temporal-postgres/bin/start.sh
              subPath: start.sh
              readOnly: true
            - name: temporal-postgres-credentials
              mountPath: /opt/temporal-postgres/secrets/password
              subPath: password
              readOnly: true
            - name: temporal-postgres-credentials
              mountPath: /opt/temporal-postgres/secrets/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: temporal-postgres-credentials
              mountPath: /opt/temporal-postgres/secrets/tls.key
              subPath: tls.key
              readOnly: true
            - name: temporal-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: temporal-postgres-bootstrap
          configMap:
            name: temporal-postgres-bootstrap
            defaultMode: 0555
        - name: temporal-postgres-credentials
          secret:
            secretName: temporal-postgres-credentials
  volumeClaimTemplates:
    - metadata:
        name: temporal-postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-schema-migrate
  labels:
    app.kubernetes.io/name: temporal-schema-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-schema-migrate
    spec:
      serviceAccountName: temporal-schema-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: temporal-schema-migrate
          image: temporalio/auto-setup:1.29.7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/temporal/bin/schema-migrate.sh
          volumeMounts:
            - name: temporal-config
              mountPath: /opt/temporal/bin/schema-migrate.sh
              subPath: schema-migrate.sh
              readOnly: true
            - name: temporal-postgres-credentials
              mountPath: /opt/temporal/secrets/postgres-password
              subPath: password
              readOnly: true
            - name: temporal-postgres-credentials
              mountPath: /opt/temporal/secrets/postgres-ca.pem
              subPath: ca.pem
              readOnly: true
      volumes:
        - name: temporal-config
          configMap:
            name: temporal-config
            defaultMode: 0555
        - name: temporal-postgres-credentials
          secret:
            secretName: temporal-postgres-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  labels:
    app.kubernetes.io/name: temporal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      serviceAccountName: temporal
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-temporal-authorities
          image: temporalio/auto-setup:1.29.7
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -ec]
          args:
            - |
              until timeout 2 bash -c 'exec 3<>/dev/tcp/temporal-postgres/5432' 2>/dev/null; do
                sleep 1
              done
              until curl --fail --silent --cacert /etc/noebs-keycloak/ca.pem --connect-timeout 2 --max-time 5 https://keycloak.noebs.svc.cluster.local:8443/auth/realms/noebs/protocol/openid-connect/certs >/dev/null; do
                sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: keycloak-transport-ca
              mountPath: /etc/noebs-keycloak/ca.pem
              subPath: ca.pem
              readOnly: true
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/temporal/bin/temporal-start.sh
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: grpc
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: grpc
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: grpc
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - name: temporal-config
              mountPath: /opt/temporal/bin/temporal-start.sh
              subPath: temporal-start.sh
              readOnly: true
            - name: temporal-config
              mountPath: /opt/temporal/config/temporal.yaml
              subPath: temporal.yaml
              readOnly: true
            - name: temporal-config
              mountPath: /opt/temporal/config/dynamicconfig/docker.yaml
              subPath: dynamicconfig.yaml
              readOnly: true
            - name: temporal-postgres-credentials
              mountPath: /opt/temporal/secrets/postgres-password
              subPath: password
              readOnly: true
            - name: temporal-postgres-credentials
              mountPath: /opt/temporal/secrets/postgres-ca.pem
              subPath: ca.pem
              readOnly: true
            - name: temporal-server-credentials
              mountPath: /opt/temporal/secrets/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: temporal-server-credentials
              mountPath: /opt/temporal/secrets/tls.key
              subPath: tls.key
              readOnly: true
            - name: keycloak-transport-ca
              mountPath: /opt/temporal/secrets/keycloak-ca.pem
              subPath: ca.pem
              readOnly: true
      volumes:
        - name: temporal-config
          configMap:
            name: temporal-config
            defaultMode: 0555
        - name: temporal-postgres-credentials
          secret:
            secretName: temporal-postgres-credentials
        - name: temporal-server-credentials
          secret:
            secretName: temporal-server-credentials
        - name: keycloak-transport-ca
          secret:
            secretName: keycloak-transport-ca
---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace-bootstrap
  labels:
    app.kubernetes.io/name: temporal-namespace-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "18"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-namespace-bootstrap
    spec:
      serviceAccountName: temporal-namespace-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: temporal-namespace-bootstrap
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/noebs
          args:
            - ensure-temporal-namespace
            - --address
            - temporal-frontend:7233
            - --token-url
            - https://keycloak.noebs.svc.cluster.local:8443/auth/realms/noebs/protocol/openid-connect/token
            - --temporal-ca
            - /etc/noebs-temporal/ca.pem
            - --keycloak-ca
            - /etc/noebs-keycloak/ca.pem
            - --client-secret
            - /etc/noebs-temporal/client-secret
          volumeMounts:
            - name: temporal-authority
              mountPath: /etc/noebs-temporal/ca.pem
              subPath: ca.pem
              readOnly: true
            - name: temporal-authority
              mountPath: /etc/noebs-temporal/client-secret
              subPath: client-secret
              readOnly: true
            - name: keycloak-transport-ca
              mountPath: /etc/noebs-keycloak/ca.pem
              subPath: ca.pem
              readOnly: true
      volumes:
        - name: temporal-authority
          secret:
            secretName: temporal-namespace-bootstrap-credentials
        - name: keycloak-transport-ca
          secret:
            secretName: keycloak-transport-ca
---
