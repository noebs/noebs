apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-chat
  annotations:
    argocd.argoproj.io/sync-wave: "21"
  labels:
    app.kubernetes.io/name: notification-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-chat
    spec:
      serviceAccountName: notification-chat
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: notification-chat
          image: ghcr.io/noebs/noebs:master
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command: [/usr/local/bin/noebs, internal-healthcheck]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/usr/local/bin/noebs, internal-healthcheck]
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/service.yaml
              subPath: notification-chat.service.yaml
              readOnly: true
            - name: notification-chat-secrets
              mountPath: /app/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: noebs-config
        - name: notification-chat-secrets
          secret:
            secretName: notification-chat-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: notification-chat
  labels:
    app.kubernetes.io/name: notification-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-chat
  ports:
    - name: http
      port: 8080
      targetPort: http
