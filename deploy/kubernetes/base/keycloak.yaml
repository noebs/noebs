apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-postgres-bootstrap
  labels:
    app.kubernetes.io/name: keycloak-postgres
data:
  start.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    pgdata="/var/lib/postgresql/data"
    postgres_user="keycloak"
    postgres_db="keycloak"
    password_source="/opt/keycloak-postgres/secrets/password"
    tls_certificate_source="/opt/keycloak-postgres/secrets/tls.crt"
    tls_private_key_source="/opt/keycloak-postgres/secrets/tls.key"
    tls_certificate_runtime="/tmp/keycloak-postgres-tls.crt"
    tls_private_key_runtime="/tmp/keycloak-postgres-tls.key"
    password_runtime="/tmp/keycloak-postgres-password"
    pgpass="/var/lib/postgresql/.pgpass"

    cleanup() {
      rm -f "$password_runtime" "$pgpass" "$tls_certificate_runtime" "$tls_private_key_runtime"
    }
    trap cleanup EXIT

    pgpass_escape() {
      local value="$1"
      value="${value//\\/\\\\}"
      value="${value//:/\\:}"
      printf '%s' "$value"
    }

    if [ ! -s "$password_source" ]; then
      echo "missing Keycloak Postgres password file: $password_source" >&2
      exit 1
    fi
    if [ ! -s "$tls_certificate_source" ] || [ ! -s "$tls_private_key_source" ]; then
      echo "missing Keycloak Postgres TLS certificate or private key" >&2
      exit 1
    fi

    install -d -o postgres -g postgres -m 0700 "$pgdata"
    install -o postgres -g postgres -m 0600 "$tls_certificate_source" "$tls_certificate_runtime"
    install -o postgres -g postgres -m 0600 "$tls_private_key_source" "$tls_private_key_runtime"

    if [ ! -s "$pgdata/PG_VERSION" ]; then
      password="$(tr -d '\r\n' < "$password_source")"
      printf '%s\n' "$password" > "$password_runtime"
      chown postgres:postgres "$password_runtime"
      chmod 0600 "$password_runtime"

      gosu postgres initdb \
        -D "$pgdata" \
        --auth-host=scram-sha-256 \
        --auth-local=scram-sha-256 \
        --username="$postgres_user" \
        --pwfile="$password_runtime"

      printf '/tmp:5432:*:%s:%s\n' "$(pgpass_escape "$postgres_user")" "$(pgpass_escape "$password")" > "$pgpass"
      chown postgres:postgres "$pgpass"
      chmod 0600 "$pgpass"

      gosu postgres pg_ctl \
        -D "$pgdata" \
        -o "-c listen_addresses='' -c unix_socket_directories=/tmp" \
        -w start
      gosu postgres psql \
        "host=/tmp dbname=postgres user=$postgres_user passfile=$pgpass" \
        --set=ON_ERROR_STOP=1 \
        --command="CREATE DATABASE $postgres_db"
      gosu postgres pg_ctl -D "$pgdata" -m fast -w stop
    fi

    cat > "$pgdata/pg_hba.conf" <<'HBA'
    local all all scram-sha-256
    hostssl all all all scram-sha-256
    hostnossl all all all reject
    HBA
    chown postgres:postgres "$pgdata/pg_hba.conf"
    chmod 0600 "$pgdata/pg_hba.conf"

    exec gosu postgres postgres \
      -D "$pgdata" \
      -c "listen_addresses=*" \
      -c "ssl=on" \
      -c "ssl_min_protocol_version=TLSv1.3" \
      -c "ssl_max_protocol_version=TLSv1.3" \
      -c "ssl_cert_file=$tls_certificate_runtime" \
      -c "ssl_key_file=$tls_private_key_runtime"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  labels:
    app.kubernetes.io/name: keycloak-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  labels:
    app.kubernetes.io/name: keycloak-postgres
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
    spec:
      serviceAccountName: keycloak-postgres
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/keycloak-postgres/bin/start.sh
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - keycloak
                - -d
                - keycloak
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - keycloak
                - -d
                - keycloak
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - keycloak
                - -d
                - keycloak
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: keycloak-postgres-bootstrap
              mountPath: /opt/keycloak-postgres/bin/start.sh
              subPath: start.sh
              readOnly: true
            - name: keycloak-postgres-credentials
              mountPath: /opt/keycloak-postgres/secrets/password
              subPath: password
              readOnly: true
            - name: keycloak-postgres-credentials
              mountPath: /opt/keycloak-postgres/secrets/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: keycloak-postgres-credentials
              mountPath: /opt/keycloak-postgres/secrets/tls.key
              subPath: tls.key
              readOnly: true
            - name: keycloak-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: keycloak-postgres-bootstrap
          configMap:
            name: keycloak-postgres-bootstrap
            defaultMode: 0555
        - name: keycloak-postgres-credentials
          secret:
            secretName: keycloak-postgres-credentials
  volumeClaimTemplates:
    - metadata:
        name: keycloak-postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak@sha256:2eb3cd316835c990e69e26ade292ffa78f6fb0db7d5fc6377463c162e1979ac0
          imagePullPolicy: IfNotPresent
          args:
            - start
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: management
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/keycloak.conf
              subPath: keycloak.conf
              readOnly: true
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/db-ca.pem
              subPath: db-ca.pem
              readOnly: true
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/tls.key
              subPath: tls.key
              readOnly: true
            - name: keycloak-data
              mountPath: /opt/keycloak/data
      volumes:
        - name: keycloak-secrets
          secret:
            secretName: keycloak-secrets
            defaultMode: 0440
        - name: keycloak-data
          emptyDir: {}
