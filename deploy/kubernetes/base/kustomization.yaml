apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noebs

resources:
  - configmap.yaml
  - service-accounts.yaml
  - postgres.yaml
  - kafka.yaml
  - temporal.yaml
  - keycloak.yaml
  - keycloak-reconcile-job.yaml
  - network-policies.yaml
  - preflight-job.yaml
  - migrate-job.yaml
  - workload-auth-cleanup.yaml
  - api-gateway.yaml
  - identity-auth.yaml
  - card-vault.yaml
  - ebs-adapter.yaml
  - ebs-adapter-events.yaml
  - psp-webhook.yaml
  - admin-reporting.yaml
  - admin-reporting-projector.yaml
  - notification-chat.yaml
  - consumer-beneficiary.yaml
  - wallet-api.yaml
  - wallet-ledger.yaml
  - wallet-worker.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: noebs

configMapGenerator:
  - name: keycloak-desired-state
    files:
      - keycloak-desired-state.yaml
