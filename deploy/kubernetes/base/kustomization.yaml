apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noebs

resources:
  - ../keycloak-authority
  - configmap.yaml
  - service-accounts.yaml
  - postgres.yaml
  - kafka.yaml
  - temporal.yaml
  - keycloak.yaml
  - keycloak-reconcile-job.yaml
  - network-policies.yaml
  - preflight-job.yaml
  - migrate-job.yaml
  - workload-auth-cleanup.yaml
  - gateway-auth-cleanup.yaml
  - api-gateway.yaml
  - identity-auth.yaml
  - card-vault.yaml
  - ebs-adapter.yaml
  - ebs-adapter-events.yaml
  - psp-webhook.yaml
  - admin-reporting.yaml
  - admin-reporting-projector.yaml
  - notification-chat.yaml
  - wallet-api.yaml
  - wallet-ledger.yaml
  - wallet-worker.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: noebs

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: tenant-catalog
          mountPath: /app/tenant-catalog.yaml
          subPath: tenant-catalog.yaml
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: tenant-catalog
          configMap:
            name: tenant-catalog
  - target:
      kind: Job
      name: noebs-(identity-auth|card-vault|ebs-adapter|admin-reporting|notification-chat|wallet-ledger|gateway-auth)-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: tenant-catalog
          mountPath: /app/tenant-catalog.yaml
          subPath: tenant-catalog.yaml
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: tenant-catalog
          configMap:
            name: tenant-catalog
