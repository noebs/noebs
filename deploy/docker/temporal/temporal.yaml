log:
  stdout: true
  level: info

persistence:
  numHistoryShards: 4
  defaultStore: default
  visibilityStore: visibility
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: temporal-postgres:5432
        connectProtocol: tcp
        user: temporal
        password: __DATABASE_PASSWORD_FROM_FILE__
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: 1h
        tls:
          enabled: true
          caFile: /opt/temporal/secrets/postgres-ca.pem
          enableHostVerification: true
          serverName: temporal-postgres
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: temporal-postgres:5432
        connectProtocol: tcp
        user: temporal
        password: __DATABASE_PASSWORD_FROM_FILE__
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: 1h
        tls:
          enabled: true
          caFile: /opt/temporal/secrets/postgres-ca.pem
          enableHostVerification: true
          serverName: temporal-postgres

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: 127.0.0.1
  pprof:
    port: 0
  tls:
    frontend:
      server:
        certFile: /opt/temporal/secrets/tls.crt
        keyFile: /opt/temporal/secrets/tls.key
        requireClientAuth: false
  authorization:
    jwtKeyProvider:
      keySourceURIs:
        - https://keycloak:8443/auth/realms/noebs/protocol/openid-connect/certs
      refreshInterval: 1m
    permissionsClaimName: permissions
    authorizer: default
    claimMapper: default
    audience: noebs-temporal

services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: 0.0.0.0
      httpPort: 0
  internal-frontend:
    rpc:
      grpcPort: 7236
      membershipPort: 6936
      bindOnIP: 127.0.0.1
      httpPort: 0
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: 127.0.0.1
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: 127.0.0.1
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: 127.0.0.1

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: internal-frontend
      rpcAddress: 127.0.0.1:7236

dcRedirectionPolicy:
  policy: noop

archival:
  history:
    state: enabled
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
  visibility:
    state: enabled
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"

namespaceDefaults:
  archival:
    history:
      state: disabled
      URI: file:///tmp/temporal_archival/development
    visibility:
      state: disabled
      URI: file:///tmp/temporal_vis_archival/development

dynamicConfigClient:
  filepath: /opt/temporal/config/dynamicconfig/docker.yaml
  pollInterval: 60s
