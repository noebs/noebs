# Local Docker Compose config only. Production Kubernetes uses the
# keycloak-secrets Secret with the same keycloak.conf format.
http-enabled=true
http-port=8080
hostname-strict=false
proxy-headers=xforwarded
health-enabled=true
metrics-enabled=true

db=postgres
db-url=jdbc:postgresql://keycloak-postgres:5432/keycloak
db-username=keycloak
db-password=keycloak

bootstrap-admin-username=admin
bootstrap-admin-password=admin
