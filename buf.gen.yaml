version: v2
plugins:
  - local: protoc-gen-go
    out: gen/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/proto
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: gen/proto
    opt: paths=source_relative
  - local: protoc-gen-openapiv2
    out: gen/openapi
    opt:
      - allow_merge=true
      - merge_file_name=noebs
